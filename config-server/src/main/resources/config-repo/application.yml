# Applies to every config-server client regardless of spring.application.name (Spring Cloud
# Config convention: a file literally named "application.yml" is global defaults, lower
# precedence than each client's own {application-name}.yml below it).
keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak.localhost:8181/realms/demo}
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak.localhost:8181/realms/demo/protocol/openid-connect/certs}

notifications:
  mail:
    from-email: ${MAIL_FROM:demo@example.com}
  fallback-email: ${NOTIFICATIONS_FALLBACK_EMAIL:admin@example.com}

spring:
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # KafkaProducer.send() blocks the CALLING thread (not just the returned future) waiting for
        # topic metadata on a broker it's never reached before — the 60s default turns "Kafka is
        # down" into "every request thread that publishes an event hangs for a minute." 3s still
        # gives a healthy broker plenty of time to answer, and bounds the worst case everywhere
        # events get published, not just the audit trail (see common-audit's KafkaAuditEventRepository).
        max.block.ms: 3000
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    # This dev machine's InetAddress.getLocalHost() resolves to a bogus public IP (observed:
    # ec2-*.amazonaws.com / a random public address) rather than anything reachable — force
    # localhost explicitly instead of trusting hostname/IP auto-detection.
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: false

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      # Demo-scale traffic — trace every request rather than tuning a sample rate. Drop this well
      # below 1.0 before this ever carries real production load.
      probability: 1.0
    export:
      otlp:
        # Off by default for the host-JVM / IntelliJ dev flow: docker-compose.yml has no Tempo or
        # OTLP collector on this branch (see local-infra.sh's header), so with export on, every
        # service logs a java.net.ConnectException to localhost:4318 on each export interval.
        # k8s/configmap-common.yaml sets TRACING_EXPORT_OTLP_ENABLED=true — next to the
        # OTEL_EXPORTER_OTLP_TRACES_ENDPOINT it already injects — so in-cluster export stays on.
        # Property name verified against Spring Boot 4.1 metadata (spring-boot-micrometer-tracing-
        # opentelemetry): management.tracing.export.otlp.enabled, default true.
        enabled: ${TRACING_EXPORT_OTLP_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          # Verified against the actual Spring Boot 4.1 OtlpTracingProperties class: this Boot
          # version's tracing autoconfiguration (spring-boot-micrometer-tracing-opentelemetry, see
          # common-security/pom.xml) exposes the endpoint under
          # management.opentelemetry.tracing.export.otlp, not management.otlp.tracing — that prefix
          # doesn't exist here and would silently bind nothing.
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
