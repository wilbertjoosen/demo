# Applies to every config-server client regardless of spring.application.name (Spring Cloud
# Config convention: a file literally named "application.yml" is global defaults, lower
# precedence than each client's own {application-name}.yml below it).
keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak.localhost:8181/realms/demo}
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak.localhost:8181/realms/demo/protocol/openid-connect/certs}

notifications:
  mail:
    from-email: ${MAIL_FROM:demo@example.com}
  fallback-email: ${NOTIFICATIONS_FALLBACK_EMAIL:admin@example.com}

spring:
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # KafkaProducer.send() blocks the CALLING thread (not just the returned future) waiting for
        # topic metadata on a broker it's never reached before — the 60s default turns "Kafka is
        # down" into "every request thread that publishes an event hangs for a minute." 3s still
        # gives a healthy broker plenty of time to answer, and bounds the worst case everywhere
        # events get published, not just the audit trail (see common-audit's KafkaAuditEventRepository).
        max.block.ms: 3000
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    # Micrometer Observation instrumentation for producer sends / listener invocations — this is
    # what propagates trace context through Kafka message headers, so a single trace can span the
    # async saga boundary (order-service publishing ORDER_CREATED -> payment-service's listener
    # picking it up) instead of tracing stopping dead at the synchronous order->inventory call.
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    # This dev machine's InetAddress.getLocalHost() resolves to a bogus public IP (observed:
    # ec2-*.amazonaws.com / a random public address) rather than anything reachable — force
    # localhost explicitly instead of trusting hostname/IP auto-detection.
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: false

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    # 100% sampling — this is a demo/dev environment where seeing every trace matters more than
    # the overhead; a real production deployment would sample a small fraction (e.g. 0.1) instead.
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          # Tempo's OTLP/HTTP receiver — verified against the actual Spring Boot 4.1
          # OtlpTracingProperties class (this project's Boot version splits tracing autoconfiguration
          # into spring-boot-micrometer-tracing-opentelemetry, a different module than the
          # micrometer-tracing-bridge-otel + opentelemetry-exporter-otlp pairing docs for older Boot
          # versions describe) — the property prefix here is
          # management.opentelemetry.tracing.export.otlp, not management.otlp.tracing.
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
