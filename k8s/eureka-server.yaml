apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: demo
  labels: { app: eureka-server, monitored: "true" }
spec:
  replicas: 1
  selector: { matchLabels: { app: eureka-server } }
  template:
    metadata: { labels: { app: eureka-server, monitored: "true" } }
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: eureka-server
          image: ghcr.io/wilbertjoosen/demo-eureka-server:31a854c1d3857860b1085cf7a802be02cab0984f
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8761 }]
          env:
            # Only var this needs — deliberately not pulling in the rest of demo-common-config
            # (DB_HOST, KAFKA_BOOTSTRAP_SERVERS, ...) for a service that doesn't use any of it.
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://tempo.monitoring.svc.cluster.local:4318/v1/traces
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "384Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8761 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8761 }
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: demo
  labels: { monitored: "true" }
spec:
  selector: { app: eureka-server }
  ports: [{ name: http, port: 8761, targetPort: 8761 }]
