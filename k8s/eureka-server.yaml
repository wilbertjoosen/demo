apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: demo-qa
  labels: { app: eureka-server, monitored: "true" }
spec:
  replicas: 1
  selector: { matchLabels: { app: eureka-server } }
  template:
    metadata: { labels: { app: eureka-server, monitored: "true" } }
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: eureka-server
          image: ghcr.io/wilbertjoosen/demo-eureka-server:1.0.1
          imagePullPolicy: Always
          ports: [{ containerPort: 8761 }]
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "384Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8761 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8761 }
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: demo-qa
  labels: { monitored: "true" }
spec:
  selector: { app: eureka-server }
  ports: [{ name: http, port: 8761, targetPort: 8761 }]
