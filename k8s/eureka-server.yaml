apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: demo-qa
  labels: { app: eureka-server, monitored: "true" }
spec:
  replicas: 1
  selector: { matchLabels: { app: eureka-server } }
  template:
    metadata: { labels: { app: eureka-server, monitored: "true" } }
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: eureka-server
          image: ghcr.io/wilbertjoosen/demo-eureka-server:1.0.1-07c5cbd
          imagePullPolicy: Always
          # No envFrom here (unlike every other app service) — eureka-server doesn't need
          # Kafka/MySQL/OTLP config, so it never picked up demo-common-config. Set directly here
          # instead: TEMPORARILY DISABLED (2026-08-25, see configmap-common.yaml's own comment) —
          # io.pyroscope:agent:2.1.2's bundled async-profiler SIGSEGVs on this cluster's JDK 26 +
          # linux/arm64.
          env:
            - name: PYROSCOPE_AGENT_ENABLED
              value: "false"
          ports: [{ containerPort: 8761 }]
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "384Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8761 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8761 }
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: demo-qa
  labels: { monitored: "true" }
spec:
  selector: { app: eureka-server }
  ports: [{ name: http, port: 8761, targetPort: 8761 }]
