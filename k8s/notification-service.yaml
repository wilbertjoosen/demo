apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: demo
  labels: { app: notification-service, monitored: "true" }
spec:
  replicas: 1
  selector: { matchLabels: { app: notification-service } }
  template:
    metadata: { labels: { app: notification-service, monitored: "true" } }
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: notification-service
          image: ghcr.io/wilbertjoosen/demo-notification-service:31a854c1d3857860b1085cf7a802be02cab0984f
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8085 }]
          envFrom:
            - configMapRef: { name: demo-common-config }
            - secretRef: { name: pyroscope-agent }
          env:
            - { name: EUREKA_INSTANCE_HOSTNAME, value: notification-service }
          resources:
            requests: { cpu: "250m", memory: "448Mi" }
            limits: { cpu: "1", memory: "768Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8085 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8085 }
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: demo
  labels: { monitored: "true" }
spec:
  selector: { app: notification-service }
  ports:
    - { name: http, port: 8085, targetPort: 8085 }
