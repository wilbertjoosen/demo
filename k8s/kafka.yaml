# In-cluster Kafka (KRaft, single broker+controller node), in the infra namespace
# (k8s/namespace-infra.yaml) alongside the rest of the datastores/brokers. Previously pods reached
# the host's demo-kafka container over its dedicated PLAINTEXT_K8S listener via
# host.k3d.internal:9094 — see docker-compose.yml's kafka service comment for why that hop is going
# away. This Deployment replaces it: pods resolve Kafka in-cluster as
# "kafka.infra.svc.cluster.local", which is what k8s/configmap-common.yaml's
# KAFKA_BOOTSTRAP_SERVERS now points at. docker-compose.yml's kafka container is untouched and
# still useful for host-JVM debugging (kcat, a local IDE run) on localhost:9092 — its
# PLAINTEXT_K8S listener is just dead weight now, since nothing reaches it from the cluster anymore.
#
# KAFKA_ADVERTISED_LISTENERS must be the SAME fully-qualified cross-namespace name, not the bare
# "kafka" — a client's *initial* bootstrap connection can use whatever hostname reaches the broker,
# but every subsequent operation (finding the consumer group coordinator, partition leaders, etc.)
# reconnects using whatever this broker tells it to advertise. A bare "kafka" only resolves for
# pods in this same namespace — every consumer in "demo" would bootstrap fine, then fail with
# UnknownHostException the moment it needed to follow that advertised (unqualified) redirect.
#
# Single listener, not the three-listener split docker-compose uses: there's no separate "host
# debugging this exact broker" concern to plan for from inside the cluster. emptyDir, not a PVC:
# topics are recreated from scratch by each service's own listener config on startup, and losing
# in-flight saga messages on a pod restart is an acceptable tradeoff for this demo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: infra
  labels: { app: kafka }
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          ports: [{ containerPort: 9092 }]
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka.infra.svc.cluster.local:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
          resources:
            requests: { cpu: "250m", memory: "640Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          readinessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 40
            periodSeconds: 20
      volumes:
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: infra
spec:
  selector: { app: kafka }
  ports: [{ name: kafka, port: 9092, targetPort: 9092 }]
