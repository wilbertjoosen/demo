apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  namespace: demo-qa
  labels: { app: audit-service, monitored: "true" }
spec:
  replicas: 1
  selector: { matchLabels: { app: audit-service } }
  template:
    metadata: { labels: { app: audit-service, monitored: "true" } }
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: audit-service
          image: ghcr.io/wilbertjoosen/demo-audit-service:1.0.1-07c5cbd
          imagePullPolicy: Always
          ports: [{ containerPort: 8090 }]
          envFrom:
            - configMapRef: { name: demo-common-config }
            - secretRef: { name: pyroscope-agent }
          env:
            # CANARY (2026-08-25): explicit env always overrides envFrom, so this re-enables the
            # agent for audit-service only while pyroscope-agent Secret stays "false" for every
            # other service — validating PYROSCOPE_PROFILER_TYPE=JFR actually works end-to-end
            # (profiles reaching the Pyroscope server) before rolling the Secret flip out fleet-wide.
            # Remove this override once validated and flip the Secret instead.
            - { name: PYROSCOPE_AGENT_ENABLED, value: "true" }
            - { name: EUREKA_INSTANCE_HOSTNAME, value: audit-service }
            # Shares the prod Elasticsearch instance (see docker-compose.qa.yml) — a separate index
            # keeps this environment's audit trail from mixing with production's.
            - { name: AUDIT_ES_INDEX, value: audit-log-qa }
          resources:
            requests: { cpu: "250m", memory: "448Mi" }
            limits: { cpu: "1", memory: "768Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8090 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8090 }
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
  namespace: demo-qa
  labels: { monitored: "true" }
spec:
  selector: { app: audit-service }
  ports: [{ name: http, port: 8090, targetPort: 8090 }]
