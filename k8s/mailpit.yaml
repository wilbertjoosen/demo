# In-cluster Mailpit, in the infra namespace (k8s/namespace-infra.yaml). Unlike MySQL/Vault/Keycloak, Mailpit was
# already a genuinely separate instance per environment on the host (docker-compose.yml's mailpit
# vs docker-compose.qa.yml's mailpit-qa) — moving in-cluster keeps that same split, just as its
# own Deployment per namespace instead of its own host container per environment. The demo-qa
# namespace gets its own copy (see the testing branch's own k8s/mailpit.yaml), not this one.
#
# emptyDir, not a PVC: Mailpit is a disposable local SMTP inbox for the demo — losing captured
# emails on a pod restart is an acceptable, already-true-today tradeoff (the host container has no
# volume mount either).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: infra
  labels: { app: mailpit }
spec:
  replicas: 1
  selector: { matchLabels: { app: mailpit } }
  template:
    metadata: { labels: { app: mailpit } }
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:latest
          ports:
            - { containerPort: 1025, name: smtp }
            - { containerPort: 8025, name: http }
          resources:
            requests: { cpu: "25m", memory: "32Mi" }
            limits: { cpu: "150m", memory: "128Mi" }
          readinessProbe:
            tcpSocket: { port: 8025 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8025 }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: infra
spec:
  selector: { app: mailpit }
  ports:
    - { name: smtp, port: 1025, targetPort: 1025 }
    - { name: http, port: 8025, targetPort: 8025 }
---
# Web UI ingress — this instance is where Grafana's email alerting (k8s/grafana.yaml) is pointed,
# since Grafana is one shared instance across demo/demo-qa but Mailpit is genuinely per-environment
# (see this file's header comment); fired alert emails land here regardless of which namespace
# they're about.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mailpit-ingress
  namespace: infra
spec:
  rules:
    - host: mailpit.demo.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: mailpit, port: { number: 8025 } }
