apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: product-media-uploads
  namespace: demo-qa
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-media-service
  namespace: demo-qa
  labels: { app: product-media-service, monitored: "true" }
spec:
  replicas: 1
  selector: { matchLabels: { app: product-media-service } }
  template:
    metadata: { labels: { app: product-media-service, monitored: "true" } }
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: product-media-service
          image: ghcr.io/wilbertjoosen/demo-product-media-service:12d4474669dcfcfe91f819879bbf25fb7f8f9292
          imagePullPolicy: Always
          ports: [{ containerPort: 8092 }]
          envFrom:
            - configMapRef: { name: demo-common-config }
          env:
            - { name: EUREKA_INSTANCE_HOSTNAME, value: product-media-service }
            - { name: MONGO_DB, value: media_qa }
            - { name: MEDIA_UPLOAD_DIR, value: /data/media-uploads }
          volumeMounts:
            - { name: media-uploads, mountPath: /data/media-uploads }
          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits: { cpu: "750m", memory: "640Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8092 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8092 }
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: media-uploads
          persistentVolumeClaim: { claimName: product-media-uploads }
---
apiVersion: v1
kind: Service
metadata:
  name: product-media-service
  namespace: demo-qa
  labels: { monitored: "true" }
spec:
  selector: { app: product-media-service }
  ports: [{ name: http, port: 8092, targetPort: 8092 }]
