apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-media-service
  namespace: demo-qa
  labels: { app: product-media-service, monitored: "true" }
spec:
  replicas: 1
  selector: { matchLabels: { app: product-media-service } }
  template:
    metadata: { labels: { app: product-media-service, monitored: "true" } }
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: product-media-service
          image: ghcr.io/wilbertjoosen/demo-product-media-service:1.1.0-061a4a9
          imagePullPolicy: Always
          ports: [{ containerPort: 8092 }]
          envFrom:
            - configMapRef: { name: demo-common-config }
            - secretRef: { name: pyroscope-agent }
            # Same aws-credentials Secret shape as main's k8s/product-media-service.yaml (created
            # via Rancher's Secrets UI, never committed) — QA gets its own Secret with the same
            # keys, same "shared instance, environment-scoped by name" reasoning as MySQL/Mongo/ES
            # above: same bucket is fine, MEDIA_UPLOAD_DIR below keeps QA's uploads under their own
            # key prefix rather than mixing with prod's.
            - secretRef: { name: aws-credentials }
          env:
            - { name: EUREKA_INSTANCE_HOSTNAME, value: product-media-service }
            - { name: MONGO_DB, value: media_qa }
            # S3 key prefix, not a filesystem path — see main's k8s/product-media-service.yaml for
            # why. media-uploads-qa keeps QA's uploads separated from prod's within the same bucket.
            - { name: MEDIA_UPLOAD_DIR, value: media-uploads-qa }
          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits: { cpu: "750m", memory: "640Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8092 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8092 }
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: product-media-service
  namespace: demo-qa
  labels: { monitored: "true" }
spec:
  selector: { app: product-media-service }
  ports: [{ name: http, port: 8092, targetPort: 8092 }]
