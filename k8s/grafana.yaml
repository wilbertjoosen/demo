# In-cluster Grafana — single shared instance for both demo (prod) and demo-qa, same reasoning as
# k8s/prometheus.yaml/k8s/tempo.yaml: one instance, not one per environment, so demo-qa's ArgoCD
# Application never fights demo's over the same objects.
#
# Replaces docker-compose.yml's own Grafana entirely (removed from both branches) rather than
# keeping a host copy — unlike the datastores/broker, Grafana had no host-JVM dev-flow use case of
# its own; it only ever existed to look at the in-cluster Prometheus/Loki/Tempo, reached through an
# ingress hairpin (prometheus.demo.localhost:18090) from outside the cluster. Being in-cluster too
# now means direct in-cluster DNS instead, and fully resolves the tracesToLogsV2 tradeoff
# k8s/loki.yaml's comment used to document — trace and log now always come from the SAME Loki,
# since nothing is split across the host/cluster boundary anymore.
#
# Admin login is NOT a plaintext env var (docker-compose's GF_SECURITY_ADMIN_USER/PASSWORD were) —
# create it yourself via Rancher's Secrets UI (namespace "monitoring"):
#
#   kubectl create secret generic grafana-admin -n monitoring \
#     --from-literal=GF_SECURITY_ADMIN_USER=admin \
#     --from-literal=GF_SECURITY_ADMIN_PASSWORD=admin
#
# (shown as a kubectl command for reference only — create it through Rancher's own Secrets screen
# rather than piping a real password through a shell history/AI session).
#
# PVC-backed (not emptyDir): losing dashboard/user state on every pod restart would defeat the
# point of the persistent instance, same reasoning as MySQL/Keycloak/Prometheus's PVCs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
      - name: Tempo
        type: tempo
        access: proxy
        url: http://tempo.monitoring.svc.cluster.local:3200
        jsonData:
          # Spring Boot auto-adds [traceId,spanId] to every log line once micrometer-tracing is on
          # the classpath (common-security/gateway-service poms), and Promtail already ships every
          # pod's stdout to this same Loki — so a trace can jump straight to its own log lines.
          tracesToLogsV2:
            datasourceUid: loki
            filterByTraceID: true
          # Same idea, trace -> profile instead of trace -> logs: jumps from a span to the exact CPU
          # profile Pyroscope's Java agent was capturing during that request, matched by service
          # name (agent's PYROSCOPE_APPLICATION_NAME, Dockerfile.service) since that's the one label
          # both a span's resource.service.name and a profile share.
          tracesToProfiles:
            datasourceUid: pyroscope
            tags: ["service.name"]
            profileTypeId: "process_cpu:cpu:nanoseconds:cpu:nanoseconds"
      - name: Pyroscope
        uid: pyroscope
        type: grafana-pyroscope-datasource
        access: proxy
        url: http://pyroscope.monitoring.svc.cluster.local:4040
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: demo-dashboards
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /etc/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  services-overview.json: |
    {
      "title": "Services Overview",
      "uid": "demo-services-overview",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "tags": ["demo"],
      "panels": [
        {
          "id": 1,
          "title": "Services Up",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "sum(up{job=~\".+-service|.+-server\"})", "legendFormat": "up", "refId": "A" }
          ]
        },
        {
          "id": 2,
          "title": "Services Down",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "count(up{job=~\".+-service|.+-server\"} == 0) OR vector(0)", "legendFormat": "down", "refId": "A" }
          ]
        },
        {
          "id": 3,
          "title": "Total HTTP Request Rate",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            { "expr": "sum(rate(http_server_requests_seconds_count[1m]))", "legendFormat": "req/s", "refId": "A" }
          ]
        },
        {
          "id": 4,
          "title": "Total JVM Heap Used",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            { "expr": "sum(jvm_memory_used_bytes{area=\"heap\"})", "legendFormat": "heap", "refId": "A" }
          ]
        },
        {
          "id": 10,
          "title": "JVM Heap Memory Used by Service",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(jvm_memory_used_bytes{area=\"heap\"}) by (job)",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 11,
          "title": "CPU Usage by Service",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "max": 1, "min": 0 }, "overrides": [] },
          "targets": [
            {
              "expr": "process_cpu_usage{job=~\".+\"}",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 12,
          "title": "HTTP Request Rate by Service",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 13 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count[1m])) by (job)",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 13,
          "title": "HTTP 5xx Error Rate by Service",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 13 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{status=~\"5..\"}[1m])) by (job)",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 14,
          "title": "Average HTTP Latency by Service",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 21 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_sum[1m])) by (job) / sum(rate(http_server_requests_seconds_count[1m])) by (job)",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 15,
          "title": "JVM Live Threads by Service",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 21 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "expr": "jvm_threads_live_threads",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ]
        }
      ]
    }

  kubernetes-overview.json: |
    {
      "title": "Kubernetes Overview (prod vs QA)",
      "uid": "demo-k8s-overview",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "tags": ["demo", "kubernetes"],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "datasource": "Prometheus",
            "query": "label_values(up, namespace)",
            "multi": true,
            "includeAll": true,
            "current": { "text": "All", "value": "$__all" },
            "refresh": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Services Up — demo (prod)",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] } },
            "overrides": []
          },
          "targets": [{ "expr": "sum(up{namespace=\"demo\"})", "legendFormat": "up", "refId": "A" }]
        },
        {
          "id": 2,
          "title": "Services Up — demo-qa (QA)",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 0 },
          "fieldConfig": {
            "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] } },
            "overrides": []
          },
          "targets": [{ "expr": "sum(up{namespace=\"demo-qa\"})", "legendFormat": "up", "refId": "A" }]
        },
        {
          "id": 3,
          "title": "Services Down — demo (prod)",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 0 },
          "fieldConfig": {
            "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] } },
            "overrides": []
          },
          "targets": [{ "expr": "count(up{namespace=\"demo\"} == 0) OR vector(0)", "legendFormat": "down", "refId": "A" }]
        },
        {
          "id": 4,
          "title": "Services Down — demo-qa (QA)",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 0 },
          "fieldConfig": {
            "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] } },
            "overrides": []
          },
          "targets": [{ "expr": "count(up{namespace=\"demo-qa\"} == 0) OR vector(0)", "legendFormat": "down", "refId": "A" }]
        },
        {
          "id": 5,
          "title": "JVM Heap Memory Used by Service",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "targets": [{
            "expr": "sum(jvm_memory_used_bytes{area=\"heap\", namespace=~\"$namespace\"}) by (namespace, app)",
            "legendFormat": "{{namespace}}/{{app}}",
            "refId": "A"
          }]
        },
        {
          "id": 6,
          "title": "CPU Usage by Service",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 },
          "targets": [{
            "expr": "process_cpu_usage{namespace=~\"$namespace\"}",
            "legendFormat": "{{namespace}}/{{app}}",
            "refId": "A"
          }]
        },
        {
          "id": 7,
          "title": "HTTP Request Rate by Service",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 13 },
          "targets": [{
            "expr": "sum(rate(http_server_requests_seconds_count{namespace=~\"$namespace\"}[1m])) by (namespace, app)",
            "legendFormat": "{{namespace}}/{{app}}",
            "refId": "A"
          }]
        },
        {
          "id": 8,
          "title": "HTTP 5xx Error Rate by Service",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 13 },
          "targets": [{
            "expr": "sum(rate(http_server_requests_seconds_count{status=~\"5..\", namespace=~\"$namespace\"}[1m])) by (namespace, app)",
            "legendFormat": "{{namespace}}/{{app}}",
            "refId": "A"
          }]
        },
        {
          "id": 9,
          "title": "Average HTTP Latency by Service",
          "type": "timeseries",
