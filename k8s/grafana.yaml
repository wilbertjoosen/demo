# In-cluster Grafana, in the "monitoring" namespace alongside Loki/Prometheus. docker-compose's own
# Grafana (docker-compose.yml) stays as-is for the host-JVM/IDE dev flow, same "host copy kept for
# local dev" pattern as every other infra piece already moved in-cluster — this isn't a replacement,
# it's a second instance wired to the in-cluster datasources instead of host.docker.internal/
# localhost ones. Reuses docker/grafana/dashboards/services-overview.json verbatim (it references
# its datasource by the plain name "Prometheus", not a UID, so naming the datasource below the same
# way is enough — no dashboard-JSON changes needed).
#
# Admin login is NOT a plaintext env var here (docker-compose's GF_SECURITY_ADMIN_USER/PASSWORD are)
# — create it yourself via Rancher's Secrets UI (namespace "monitoring"):
#
#   kubectl create secret generic grafana-admin -n monitoring \
#     --from-literal=GF_SECURITY_ADMIN_USER=admin \
#     --from-literal=GF_SECURITY_ADMIN_PASSWORD=admin
#
# (shown as a kubectl command for reference only — same demo-scale values as docker-compose's, but
# create it through Rancher's own Secrets screen rather than piping a real password through a shell
# history/AI session).
#
# PVC-backed (not emptyDir): losing dashboard/user state on every pod restart would defeat the
# point of the persistent instance, same reasoning as MySQL/Keycloak/Prometheus's PVCs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
      - name: Loki (k8s)
        type: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
      - name: Tempo
        type: tempo
        access: proxy
        url: http://tempo.monitoring.svc.cluster.local:3200
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: demo-dashboards
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /etc/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  services-overview.json: |
    {
      "title": "Services Overview",
      "uid": "demo-services-overview",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "tags": ["demo"],
      "panels": [
        {
          "id": 1,
          "title": "Services Up",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "sum(up{job=~\".+-service|.+-server\"})", "legendFormat": "up", "refId": "A" }
          ]
        },
        {
          "id": 2,
          "title": "Services Down",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "count(up{job=~\".+-service|.+-server\"} == 0) OR vector(0)", "legendFormat": "down", "refId": "A" }
          ]
        },
        {
          "id": 3,
          "title": "Total HTTP Request Rate",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            { "expr": "sum(rate(http_server_requests_seconds_count[1m]))", "legendFormat": "req/s", "refId": "A" }
          ]
        },
        {
          "id": 4,
          "title": "Total JVM Heap Used",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            { "expr": "sum(jvm_memory_used_bytes{area=\"heap\"})", "legendFormat": "heap", "refId": "A" }
          ]
        },
        {
          "id": 10,
          "title": "JVM Heap Memory Used by Service",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(jvm_memory_used_bytes{area=\"heap\"}) by (job)",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 11,
          "title": "CPU Usage by Service",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "max": 1, "min": 0 }, "overrides": [] },
          "targets": [
            {
              "expr": "process_cpu_usage{job=~\".+\"}",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 12,
          "title": "HTTP Request Rate by Service",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 13 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count[1m])) by (job)",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 13,
          "title": "HTTP 5xx Error Rate by Service",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 13 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{status=~\"5..\"}[1m])) by (job)",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 14,
          "title": "Average HTTP Latency by Service",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 21 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_sum[1m])) by (job) / sum(rate(http_server_requests_seconds_count[1m])) by (job)",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 15,
          "title": "JVM Live Threads by Service",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 21 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "expr": "jvm_threads_live_threads",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels: { app: grafana }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports: [{ containerPort: 3000 }]
          envFrom:
            - secretRef: { name: grafana-admin }
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards, mountPath: /etc/grafana/dashboards }
            - { name: data, mountPath: /var/lib/grafana }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: datasources
          configMap: { name: grafana-datasources }
        - name: dashboard-provider
          configMap: { name: grafana-dashboard-provider }
        - name: dashboards
          configMap: { name: grafana-dashboards }
        - name: data
          persistentVolumeClaim: { claimName: grafana-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector: { app: grafana }
  ports: [{ port: 3000, targetPort: 3000 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: monitoring
spec:
  rules:
    - host: grafana.demo.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: grafana, port: { number: 3000 } }
