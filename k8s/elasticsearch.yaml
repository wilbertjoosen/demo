# In-cluster Elasticsearch (single-node dev config, matching docker-compose.yml's own) for the
# demo namespace. This branch has no demo-qa counterpart namespace, so no cross-namespace sharing
# needed (unlike main/testing's k8s/elasticsearch.yaml).
#
# The initContainer is the standard ES-on-k8s fix for the classic "max virtual memory areas vm.max_
# map_count [65530] is too low" startup failure — Elasticsearch needs at least 262144, and that's a
# NODE-level (not container-level) kernel setting, hence the privileged initContainer running once
# per pod placement rather than something set in the main container's own securityContext.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: infra
  labels: { app: elasticsearch }
spec:
  serviceName: elasticsearch
  replicas: 1
  selector: { matchLabels: { app: elasticsearch } }
  template:
    metadata: { labels: { app: elasticsearch } }
    spec:
      initContainers:
        - name: set-max-map-count
          image: busybox:1.36
          command: ["sysctl", "-w", "vm.max_map_count=262144"]
          securityContext: { privileged: true }
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
          ports: [{ containerPort: 9200 }]
          env:
            - { name: discovery.type, value: "single-node" }
            - { name: xpack.security.enabled, value: "false" }
            - { name: ES_JAVA_OPTS, value: "-Xms512m -Xmx512m" }
          volumeMounts:
            - { name: data, mountPath: /usr/share/elasticsearch/data }
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "1500m", memory: "1536Mi" }
          readinessProbe:
            httpGet: { path: /_cluster/health, port: 9200 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /_cluster/health, port: 9200 }
            initialDelaySeconds: 60
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: infra
spec:
  selector: { app: elasticsearch }
  ports: [{ name: http, port: 9200, targetPort: 9200 }]
