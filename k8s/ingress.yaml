# k3d ships Traefik as its default ingress controller — no separate install needed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-ingress
  namespace: demo
spec:
  rules:
    - host: demo.localhost
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: gateway-service, port: { number: 8080 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }
