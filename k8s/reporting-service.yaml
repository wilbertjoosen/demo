# StatefulSet rather than Deployment: each Kafka Streams instance owns a disjoint slice of the
# source topics' partitions and needs its own persistent RocksDB state store (see ReportingTopology)
# — a Deployment's PVC would be shared/reused across pod identities, which is wrong once there's
# more than one replica. volumeClaimTemplates gives every replica ordinal (reporting-service-0,
# reporting-service-1, ...) its own PVC automatically, so scaling later is just `replicas: N`, no
# manifest surgery. Still pinned to replicas: 1 today — see the note on the headless Service below
# for what's still missing before a real multi-replica rollout.
#
# containerPort/probes/Services are 8095, NOT reporting-service/application.yaml's own 8097 on
# this branch: the CI/CD "Promote testing's images to production" job deploys prod on whatever
# image testing already built and tested, not a fresh build from main's own source (see
# .github/workflows/ci-cd.yml) — so the container actually running here is testing branch's build,
# which listens on 8095 (its own local port-conflict fix). main's application.yaml staying off 8095
# is deliberate too, just for a different reason: it avoids colliding with kafka-ui's host port on
# *this* branch's docker-compose.yml for anyone running reporting-service directly via mvnw on a
# main checkout (8097, not 8096, since 8096 is common-service's own bundled default) — that value
# never actually reaches this Deployment either way. If the promotion mechanism ever changes to
# build main independently, this file needs to go back to matching application.yaml's own port
# instead.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: reporting-service
  namespace: demo
  labels: { app: reporting-service, monitored: "true" }
spec:
  serviceName: reporting-service-headless
  replicas: 1
  selector: { matchLabels: { app: reporting-service } }
  template:
    metadata: { labels: { app: reporting-service, monitored: "true" } }
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: reporting-service
          image: ghcr.io/wilbertjoosen/demo-reporting-service:1.0.2-522bf29
          imagePullPolicy: Always
          ports: [{ containerPort: 8095 }]
          envFrom:
            - configMapRef: { name: demo-common-config }
          env:
            - { name: EUREKA_INSTANCE_HOSTNAME, value: reporting-service }
            # RocksDB state store dir — must be on the mounted volume below, not the container's
            # own ephemeral filesystem, otherwise every pod restart forces a full Kafka Streams
            # replay of every source topic (order/product/user/payment/shipping/delivery-events)
            # from the beginning instead of just resuming from local disk.
            - { name: KAFKA_STREAMS_STATE_DIR, value: /data/kafka-streams }
          volumeMounts:
            - { name: streams-state, mountPath: /data/kafka-streams }
          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits: { cpu: "750m", memory: "640Mi" }
          # Kafka Streams restores its RocksDB state stores by replaying 6 source topics
          # (user/product/order/payment/shipping/delivery-events) from scratch on a cold start,
          # which genuinely takes longer than a normal Spring Boot app's startup — without a
          # startupProbe, livenessProbe's fixed 30s initialDelaySeconds was firing (and failing,
          # nothing listening yet) before the app ever got a chance to finish, killing the
          # container in an endless restart loop that never actually completed the restore.
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: 8095 }
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8095 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8095 }
            initialDelaySeconds: 30
            periodSeconds: 15
  volumeClaimTemplates:
    - metadata:
        name: streams-state
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 1Gi }
---
# Headless (clusterIP: None) — required by StatefulSet for stable per-pod DNS identity
# (reporting-service-0.reporting-service-headless.demo.svc.cluster.local, etc.). Not used for
# routing today; it becomes relevant if reporting-service ever scales past 1 replica, since each
# instance's Kafka Streams state store only holds its own partitions' data — Interactive Queries
# for a key on the wrong instance need to be forwarded to the instance that actually owns it,
# which is the standard use for per-pod addresses like these (Spring Kafka's
# KafkaStreamsInteractiveQueryService exposes getKafkaStreamsApplicationHostInfo(...) for exactly
# this, but the forwarding itself isn't implemented — see the note below).
apiVersion: v1
kind: Service
metadata:
  name: reporting-service-headless
  namespace: demo
  labels: { monitored: "true" }
spec:
  clusterIP: None
  selector: { app: reporting-service }
  ports: [{ name: http, port: 8095, targetPort: 8095 }]
---
# Regular ClusterIP Service — this is what actually carries traffic today. Eureka registers each
# instance under EUREKA_INSTANCE_HOSTNAME (fixed to "reporting-service" above), and other services'
# HTTP calls to that hostname resolve through this Service's DNS/VIP, not the headless one.
apiVersion: v1
kind: Service
metadata:
  name: reporting-service
  namespace: demo
  labels: { monitored: "true" }
spec:
  selector: { app: reporting-service }
  ports: [{ name: http, port: 8095, targetPort: 8095 }]
