# Shared by every app Deployment via envFrom.configMapRef. Most infra deliberately stays in
# docker-compose on the host, not in this cluster (matches the project's existing "infra on host,
# app services containerized" split). host.k3d.internal is k3d's built-in DNS name for the host
# machine, reaching whatever docker-compose already publishes there.
#
# Kafka and Redis are the exception: they now run IN this cluster (k8s/kafka.yaml, k8s/redis.yaml)
# instead of on the host, so KAFKA_BOOTSTRAP_SERVERS/REDIS_HOST below point at their in-cluster
# Service names, not host.k3d.internal. docker-compose.yml's kafka/redis containers still exist for
# host-JVM debugging (kcat, redis-cli, a local IDE run) but the cluster itself no longer depends on
# them. The demo-qa namespace (testing branch) already made the same switch.
#
# MySQL/MongoDB/Elasticsearch/Keycloak/Mailpit/Vault stay host-based via host.k3d.internal, same as
# before.
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-common-config
  namespace: demo
data:
  CONFIG_SERVER_URI: http://config-server:8888
  EUREKA_URI: http://eureka-server:8761/eureka
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/demo
  KEYCLOAK_JWK_SET_URI: http://host.k3d.internal:8081/realms/demo/protocol/openid-connect/certs
  KEYCLOAK_TOKEN_URI: http://host.k3d.internal:8081/realms/demo/protocol/openid-connect/token
  KEYCLOAK_ADMIN_URI: http://host.k3d.internal:8081/admin/realms/demo
  # 3-node replica set (task #74) — host.docker.internal, not host.k3d.internal: the replica set's
  # own config (see docker-compose.yml's mongo-rs-init) identifies its members by that address, so
  # using it directly here avoids a seed-then-redirect hop. Verified reachable from k8s pods
  # (k3d's own nodes are themselves Docker Desktop containers, so this resolves the same way
  # host.k3d.internal does — proven via a live nslookup + nc from inside this cluster).
  MONGO_HOST: host.docker.internal:27017,host.docker.internal:27018,host.docker.internal:27019
  MONGO_REPLICA_SET_PARAM: "?replicaSet=rs0"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  ELASTICSEARCH_URI: http://host.k3d.internal:9200
  DB_HOST: host.k3d.internal
  DB_PORT: "3306"
  DB_NAME: demo
  MAIL_HOST: host.k3d.internal
  MAIL_PORT: "1025"
  INVENTORY_SERVICE_URI: http://inventory-service:8089
  CORS_ALLOWED_ORIGINS: http://localhost:5173,http://demo.localhost:18090
  # Tempo's OTLP/HTTP receiver, running alongside Grafana/Loki/Prometheus in docker-compose —
  # see config-server's config-repo/application.yml for how every service picks this up.
  OTLP_ENDPOINT: http://host.k3d.internal:4318/v1/traces
  # Task #75, real secrets management — Vault dev-mode instance, single node (no topology
  # discovery needed, unlike Mongo's replica set), reached the same way as every other host-side
  # infra process in this file. The token itself is sensitive and lives in the vault-token k8s
  # Secret (created imperatively per-namespace, not committed — same pattern as ghcr-pull-secret).
  VAULT_HOST: host.k3d.internal
  VAULT_PORT: "8200"
