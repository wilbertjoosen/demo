# Shared by every app Deployment via envFrom.configMapRef — infra (MySQL/Mongo/Kafka/Redis/
# Keycloak/Elasticsearch/Mailpit) deliberately stays in docker-compose on the host, not in this
# cluster (matches the project's existing "infra on host, app services containerized" split).
# host.k3d.internal is k3d's built-in DNS name for the host machine, reaching whatever
# docker-compose already publishes there.
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-common-config
  namespace: demo
data:
  CONFIG_SERVER_URI: http://config-server:8888
  EUREKA_URI: http://eureka-server:8761/eureka
  # port 9094: Kafka's PLAINTEXT_K8S listener, dedicated to pods in this cluster (see docker-compose.yml).
  KAFKA_BOOTSTRAP_SERVERS: host.k3d.internal:9094
  KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/demo
  KEYCLOAK_JWK_SET_URI: http://host.k3d.internal:8081/realms/demo/protocol/openid-connect/certs
  KEYCLOAK_TOKEN_URI: http://host.k3d.internal:8081/realms/demo/protocol/openid-connect/token
  MONGO_HOST: host.k3d.internal
  MONGO_PORT: "27017"
  REDIS_HOST: host.k3d.internal
  REDIS_PORT: "6379"
  ELASTICSEARCH_URI: http://host.k3d.internal:9200
  DB_HOST: host.k3d.internal
  DB_PORT: "3306"
  DB_NAME: demo
  MAIL_HOST: host.k3d.internal
  MAIL_PORT: "1025"
  INVENTORY_SERVICE_URI: http://inventory-service:8089
  CORS_ALLOWED_ORIGINS: http://localhost:5173,http://demo.localhost:18090
