# Shared by every app Deployment via envFrom.configMapRef — infra (MySQL/Mongo/Kafka/Redis/
# Keycloak/Elasticsearch/Mailpit) deliberately stays in docker-compose on the host, not in this
# cluster (matches the project's existing "infra on host, app services containerized" split).
# host.k3d.internal is k3d's built-in DNS name for the host machine, reaching whatever
# docker-compose already publishes there.
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-common-config
  namespace: demo-qa
data:
  CONFIG_SERVER_URI: http://config-server:8888
  EUREKA_URI: http://eureka-server:8761/eureka
  # port 9194: QA Kafka's own PLAINTEXT_K8S listener (see docker-compose.qa.yml) — fully isolated
  # from the production stack's Kafka on port 9094.
  KAFKA_BOOTSTRAP_SERVERS: host.k3d.internal:9194
  KEYCLOAK_ISSUER_URI: http://localhost:8082/realms/demo
  KEYCLOAK_JWK_SET_URI: http://host.k3d.internal:8082/realms/demo/protocol/openid-connect/certs
  KEYCLOAK_TOKEN_URI: http://host.k3d.internal:8082/realms/demo/protocol/openid-connect/token
  KEYCLOAK_ADMIN_URI: http://host.k3d.internal:8082/admin/realms/demo
  MONGO_HOST: host.k3d.internal
  MONGO_PORT: "27018"
  REDIS_HOST: host.k3d.internal
  REDIS_PORT: "6380"
  ELASTICSEARCH_URI: http://host.k3d.internal:9201
  DB_HOST: host.k3d.internal
  DB_PORT: "3307"
  DB_NAME: demo
  MAIL_HOST: host.k3d.internal
  MAIL_PORT: "1026"
  INVENTORY_SERVICE_URI: http://inventory-service:8089
  CORS_ALLOWED_ORIGINS: http://qa.demo.localhost:18090
