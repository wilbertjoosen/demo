# In-cluster Loki for the demo namespace, in its own "monitoring" namespace (this branch has no
# k8s/prometheus.yaml, so this file owns creating that namespace — main/testing's equivalent
# namespace is instead created by their own k8s/prometheus.yaml).
#
# Unlike main/testing, k8s's own Promtail DaemonSet (k8s/promtail-daemonset.yaml) already pushed
# to the HOST Loki successfully before this (push-direction traffic works fine across the
# host/cluster boundary) — this split is a deliberate choice for consistency with main/testing's
# architecture, not a fix for a reachability problem. Tradeoff: Tempo's trace-to-logs jump would
# only find logs in one fixed Loki, but this branch has no Tempo at all, so that tradeoff doesn't
# apply here.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: monitoring
  labels: { app: loki }
spec:
  replicas: 1
  selector: { matchLabels: { app: loki } }
  template:
    metadata: { labels: { app: loki } }
    spec:
      containers:
        - name: loki
          image: grafana/loki:latest
          ports: [{ containerPort: 3100 }]
          volumeMounts:
            - { name: data, mountPath: /loki }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /ready, port: 3100 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ready, port: 3100 }
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: monitoring
spec:
  selector: { app: loki }
  ports: [{ port: 3100, targetPort: 3100 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loki-ingress
  namespace: monitoring
spec:
  rules:
    - host: loki.demo.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: loki, port: { number: 3100 } }
