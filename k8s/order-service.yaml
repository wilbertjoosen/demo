# Also the sidecar-pattern demo: an nginx:alpine access-log sidecar in the same pod as the app
# container, sharing the pod's network namespace — a second, minimal container per Deployment
# instead of baking cross-cutting concerns (here: access logging) into the app image itself.
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-sidecar-nginx-conf
  namespace: demo
data:
  default.conf: |
    server {
      listen 8091;
      location / {
        proxy_pass http://localhost:8084;
        access_log /dev/stdout;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: demo
  labels: { app: order-service, monitored: "true" }
spec:
  replicas: 1
  selector: { matchLabels: { app: order-service } }
  template:
    metadata: { labels: { app: order-service, monitored: "true" } }
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: order-service
          image: ghcr.io/wilbertjoosen/demo-order-service:c5fd0379927a52bd5a4bd923030a0e5933cdc4d4
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8084 }]
          envFrom:
            - configMapRef: { name: demo-common-config }
            - secretRef: { name: order-service-db }
          env:
            - { name: EUREKA_INSTANCE_HOSTNAME, value: order-service }
            - { name: MONGO_DB, value: orders }
          resources:
            requests: { cpu: "250m", memory: "448Mi" }
            limits: { cpu: "1", memory: "768Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8084 }
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8084 }
            initialDelaySeconds: 35
            periodSeconds: 15
        - name: access-log-sidecar
          image: nginx:alpine
          ports: [{ containerPort: 8091 }]
          resources:
            requests: { cpu: "50m", memory: "32Mi" }
            limits: { cpu: "100m", memory: "64Mi" }
          volumeMounts:
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d }
      volumes:
        - name: nginx-conf
          configMap: { name: order-service-sidecar-nginx-conf }
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: demo
  labels: { monitored: "true" }
spec:
  selector: { app: order-service }
  ports: [{ name: http, port: 8084, targetPort: 8084 }]
