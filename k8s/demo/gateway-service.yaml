# because MEMORY (not CPU) was over target — each pod's actual footprint already exceeded its
# request, so more replicas just repeated the same overshoot instead of relieving it, pinning
# every service at 5 replicas and starving the shared host. Kept here (commented, not deleted)
# as the config/history to restore once resource requests are sized properly or more host
# capacity is available. To re-enable: uncomment the block below.
# # Every request from the browser passes through this one service first, making it the most
# # load-sensitive Deployment in the whole namespace — starts at the existing single replica,
# # scales out under real load instead of needing a manual redeploy to bump replicas. Relies on
# # metrics-server, which k3d/k3s bundles by default (not disabled anywhere in this repo's cluster
# # creation command — see k8s-local.sh) — without it the HPA applies fine but shows <unknown> for
# # current metrics and never actually scales.
