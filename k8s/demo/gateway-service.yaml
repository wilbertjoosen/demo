apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: demo
  labels: { app: gateway-service, monitored: "true" }
spec:
  replicas: 1
  selector: { matchLabels: { app: gateway-service } }
  template:
    metadata: { labels: { app: gateway-service, monitored: "true" } }
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: gateway-service
          image: ghcr.io/wilbertjoosen/demo-gateway-service:1.0.1-604f8c5
          imagePullPolicy: Always
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: demo-common-config }
            - secretRef: { name: pyroscope-agent }
          env:
            - { name: EUREKA_INSTANCE_HOSTNAME, value: gateway-service }
          resources:
            requests: { cpu: "150m", memory: "256Mi" }
            # Bumped 384Mi -> 512Mi (2026-08-25) — repeatedly OOMKilled (4+ times) during the
            # Pyroscope re-enable rollout right after Spring Boot startup completed, same JFR
            # profiling-overhead pattern that forced the same fix on eureka-server earlier today.
            limits: { cpu: "500m", memory: "512Mi" }
          # Gates livenessProbe until the app has finished starting, so a slow JVM start
          # under CPU contention (e.g. a cluster-wide image bump restarting every pod at
          # once) can't trip liveness and cascade the whole namespace into CrashLoopBackOff.
          # 30 x 10s = 5 min startup budget; liveness/readiness take over once it passes.
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            timeoutSeconds: 5
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: demo
  labels: { monitored: "true" }
spec:
  selector: { app: gateway-service }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
