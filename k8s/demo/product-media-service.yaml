apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-media-service
  namespace: demo
  labels: { app: product-media-service, monitored: "true" }
spec:
  replicas: 1
  selector: { matchLabels: { app: product-media-service } }
  template:
    metadata: { labels: { app: product-media-service, monitored: "true" } }
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: product-media-service
          image: ghcr.io/wilbertjoosen/demo-product-media-service:1.1.0-061a4a9
          imagePullPolicy: Always
          ports: [{ containerPort: 8092 }]
          envFrom:
            - configMapRef: { name: demo-common-config }
            - secretRef: { name: pyroscope-agent }
            # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (read by the S3 SDK's default credential
            # provider chain), AWS_S3_BUCKET_NAME (aws.s3.bucket-name), AWS_REGION
            # (spring.cloud.aws.region.static, via config-server's shared config-repo) — created
            # imperatively via Rancher's Secrets UI, never committed to git.
            - secretRef: { name: aws-credentials }
          env:
            - { name: EUREKA_INSTANCE_HOSTNAME, value: product-media-service }
            - { name: MONGO_DB, value: media }
            # No longer a filesystem path — StoragePort's only implementation is S3StorageAdapter
            # now, so this is the S3 key prefix each upload's object key is joined onto
            # (MediaFileStorageService.store), not a local mountPath. The old local-disk PVC and
            # its volumeMount are gone; uploads go straight from the incoming MultipartFile's bytes
            # to S3, never touching this container's own disk.
            - { name: MEDIA_UPLOAD_DIR, value: media-uploads }
          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits: { cpu: "750m", memory: "640Mi" }
          # Gates livenessProbe until the app has finished starting, so a slow JVM start
          # under CPU contention (e.g. a cluster-wide image bump restarting every pod at
          # once) can't trip liveness and cascade the whole namespace into CrashLoopBackOff.
          # 30 x 10s = 5 min startup budget; liveness/readiness take over once it passes.
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: 8092 }
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8092 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8092 }
            timeoutSeconds: 5
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: product-media-service
  namespace: demo
  labels: { monitored: "true" }
spec:
  selector: { app: product-media-service }
  ports: [{ name: http, port: 8092, targetPort: 8092 }]
