apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: payment-proofs
  namespace: demo
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: demo
  labels: { app: payment-service, monitored: "true" }
spec:
  replicas: 1
  selector: { matchLabels: { app: payment-service } }
  template:
    metadata: { labels: { app: payment-service, monitored: "true" } }
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: payment-service
          image: ghcr.io/wilbertjoosen/demo-payment-service:1.0.1-966aac3
          imagePullPolicy: Always
          ports: [{ containerPort: 8086 }]
          envFrom:
            - configMapRef: { name: demo-common-config }
            - secretRef: { name: pyroscope-agent }
          env:
            - { name: EUREKA_INSTANCE_HOSTNAME, value: payment-service }
            - { name: MONGO_DB, value: payments }
            - { name: PAYMENT_PROOF_UPLOAD_DIR, value: /data/payment-proofs }
          volumeMounts:
            - { name: payment-proofs, mountPath: /data/payment-proofs }
          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits: { cpu: "750m", memory: "640Mi" }
          # Gates livenessProbe until the app has finished starting, so a slow JVM start
          # under CPU contention (e.g. a cluster-wide image bump restarting every pod at
          # once) can't trip liveness and cascade the whole namespace into CrashLoopBackOff.
          # 30 x 10s = 5 min startup budget; liveness/readiness take over once it passes.
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: 8086 }
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8086 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8086 }
            timeoutSeconds: 5
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: payment-proofs
          persistentVolumeClaim: { claimName: payment-proofs }
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: demo
  labels: { monitored: "true" }
spec:
  selector: { app: payment-service }
  ports: [{ name: http, port: 8086, targetPort: 8086 }]
