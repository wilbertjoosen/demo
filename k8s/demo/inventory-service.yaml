apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: demo
  labels: { app: inventory-service, monitored: "true" }
spec:
  replicas: 1
  selector: { matchLabels: { app: inventory-service } }
  template:
    metadata: { labels: { app: inventory-service, monitored: "true" } }
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: inventory-service
          image: ghcr.io/wilbertjoosen/demo-inventory-service:1.0.1-ba926d7
          imagePullPolicy: Always
          ports: [{ containerPort: 8089 }]
          envFrom:
            - configMapRef: { name: demo-common-config }
            - secretRef: { name: pyroscope-agent }
          env:
            - { name: EUREKA_INSTANCE_HOSTNAME, value: inventory-service }
            - { name: MONGO_DB, value: inventory }
          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits: { cpu: "750m", memory: "640Mi" }
          # Gates livenessProbe until the app has finished starting, so a slow JVM start
          # under CPU contention (e.g. a cluster-wide image bump restarting every pod at
          # once) can't trip liveness and cascade the whole namespace into CrashLoopBackOff.
          # 30 x 10s = 5 min startup budget; liveness/readiness take over once it passes.
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: 8089 }
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8089 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8089 }
            timeoutSeconds: 5
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: demo
  labels: { monitored: "true" }
spec:
  selector: { app: inventory-service }
  ports: [{ name: http, port: 8089, targetPort: 8089 }]
---
# Same reasoning as gateway-service.yaml's HPA (see there for the full explanation) — every
# order-service reserve() call round-trips through here, and it's the sole authority for stock, so
# it's worth scaling out under load rather than becoming the bottleneck the whole saga waits on.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inventory-service
  namespace: demo
  labels: { monitored: "true" }
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inventory-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
    - type: Resource
      resource: { name: memory, target: { type: Utilization, averageUtilization: 80 } }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
