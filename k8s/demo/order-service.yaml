# Also the sidecar-pattern demo: an nginx:alpine access-log sidecar in the same pod as the app
# container, sharing the pod's network namespace — a second, minimal container per Deployment
# instead of baking cross-cutting concerns (here: access logging) into the app image itself.
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-sidecar-nginx-conf
  namespace: demo
data:
  default.conf: |
    server {
      listen 8091;
      location / {
        proxy_pass http://localhost:8084;
        access_log /dev/stdout;
      }
    }
---
# Argo Rollouts canary (task #73) — order-service is the saga initiator and most user-facing
# service, chosen as the one flagship example rather than converting all 19 services. No
# trafficRouting block: that needs a mesh/ingress plugin (Istio, SMI, an NGINX/ALB controller),
# none of which this cluster runs. Basic canary instead approximates each step's weight by the
# ratio of canary-to-stable REPLICA COUNTS, which still works correctly here because the gateway
# resolves order-service via Eureka client-side load balancing (lb://order-service) — every pod
# replica registers as its own Eureka instance, so Spring Cloud LoadBalancer's round-robin across
# them approximates the requested traffic split the same way a Service-based router would.
# replicas: 2 (not 1) so a step actually has something to split between — bumped no further than
# that to keep the resource footprint close to this project's existing single-replica norm.
#
# Temporarily dropped to 1 (see the HPA comment below): on a single local k3d host, running every
# service's floor above 1 replica was starving the shared node. At 1 replica a canary step can't
# meaningfully split traffic (nothing to divide between), so canary is effectively a no-op until
# this is restored to 2 — acceptable trade-off here; revert replicas to 2 to restore it.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: order-service
  namespace: demo
  labels: { app: order-service, monitored: "true" }
spec:
  replicas: 1
  strategy:
    canary:
      steps:
        - setWeight: 50
        - pause: { duration: 30s }
        - setWeight: 100
  selector: { matchLabels: { app: order-service } }
  template:
    metadata: { labels: { app: order-service, monitored: "true" } }
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: order-service
          image: ghcr.io/wilbertjoosen/demo-order-service:1.0.1-604f8c5
          imagePullPolicy: Always
          ports: [{ containerPort: 8084 }]
          envFrom:
            - configMapRef: { name: demo-common-config }
            - secretRef: { name: pyroscope-agent }
          env:
            - { name: EUREKA_INSTANCE_HOSTNAME, value: order-service }
            - { name: MONGO_DB, value: orders }
            # Task #75: DB_USERNAME/DB_PASSWORD/ORDER_SERVICE_CLIENT_SECRET no longer come from a
            # committed k8s Secret — order-service fetches them itself from Vault at startup
            # (spring.cloud.vault.*, see application.yaml). Only the Vault connection info itself
            # is needed here, and only the token is sensitive.
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef: { name: vault-token, key: token }
          resources:
            requests: { cpu: "250m", memory: "448Mi" }
            limits: { cpu: "1", memory: "768Mi" }
          # Gates livenessProbe until the app has finished starting, so a slow JVM start
          # under CPU contention (e.g. a cluster-wide image bump restarting every pod at
          # once) can't trip liveness and cascade the whole namespace into CrashLoopBackOff.
          # 30 x 10s = 5 min startup budget; liveness/readiness take over once it passes.
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: 8084 }
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8084 }
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8084 }
            timeoutSeconds: 5
            initialDelaySeconds: 35
            periodSeconds: 15
        - name: access-log-sidecar
          image: nginx:alpine
          ports: [{ containerPort: 8091 }]
          resources:
            requests: { cpu: "50m", memory: "32Mi" }
            limits: { cpu: "100m", memory: "64Mi" }
          volumeMounts:
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d }
      volumes:
        - name: nginx-conf
          configMap: { name: order-service-sidecar-nginx-conf }
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: demo
  labels: { monitored: "true" }
spec:
  selector: { app: order-service }
  ports: [{ name: http, port: 8084, targetPort: 8084 }]
---
