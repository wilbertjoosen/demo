apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-review-service
  namespace: demo
  labels: { app: product-review-service, monitored: "true" }
spec:
  replicas: 1
  selector: { matchLabels: { app: product-review-service } }
  template:
    metadata: { labels: { app: product-review-service, monitored: "true" } }
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: product-review-service
          image: ghcr.io/wilbertjoosen/demo-product-review-service:1.0.1-604f8c5
          imagePullPolicy: Always
          ports: [{ containerPort: 8093 }]
          envFrom:
            - configMapRef: { name: demo-common-config }
            - secretRef: { name: pyroscope-agent }
          env:
            - { name: EUREKA_INSTANCE_HOSTNAME, value: product-review-service }
            - { name: MONGO_DB, value: reviews }
          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits: { cpu: "750m", memory: "640Mi" }
          # Gates livenessProbe until the app has finished starting, so a slow JVM start
          # under CPU contention (e.g. a cluster-wide image bump restarting every pod at
          # once) can't trip liveness and cascade the whole namespace into CrashLoopBackOff.
          # 30 x 10s = 5 min startup budget; liveness/readiness take over once it passes.
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: 8093 }
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8093 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8093 }
            timeoutSeconds: 5
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: product-review-service
  namespace: demo
  labels: { monitored: "true" }
spec:
  selector: { app: product-review-service }
  ports: [{ name: http, port: 8093, targetPort: 8093 }]
