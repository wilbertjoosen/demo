apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-service
  namespace: demo
  labels: { app: delivery-service, monitored: "true" }
spec:
  replicas: 1
  selector: { matchLabels: { app: delivery-service } }
  template:
    metadata: { labels: { app: delivery-service, monitored: "true" } }
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: delivery-service
          image: ghcr.io/wilbertjoosen/demo-delivery-service:1.0.1-e20ccd4
          imagePullPolicy: Always
          ports: [{ containerPort: 8087 }]
          envFrom:
            - configMapRef: { name: demo-common-config }
          env:
            - { name: EUREKA_INSTANCE_HOSTNAME, value: delivery-service }
            - { name: MONGO_DB, value: deliveries }
          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits: { cpu: "750m", memory: "640Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8087 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8087 }
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: delivery-service
  namespace: demo
  labels: { monitored: "true" }
spec:
  selector: { app: delivery-service }
  ports: [{ name: http, port: 8087, targetPort: 8087 }]
