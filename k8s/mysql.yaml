# In-cluster MySQL for the demo namespace. Same sharing model docker-compose.yml already used on
# the host (see its own mysql comment / docker-compose.qa.yml's header): ONE instance, shared by
# both demo and demo-qa — QA gets its own database name (demo_qa) instead of a duplicate
# container, same reasoning as MySQL/Mongo/Elasticsearch/Keycloak already being shared today. The
# demo-qa namespace reaches this via cross-namespace Service DNS (mysql.demo.svc.cluster.local —
# see k8s/configmap-common.yaml on the testing branch), the same way k8s namespaces can always
# reach each other's Services by default (no NetworkPolicy restricting it here).
#
# Credentials come from a Secret created imperatively, NOT committed here — same pattern as
# ghcr-pull-secret and the vault-token Secret (see configmap-common.yaml's comment):
#
#   kubectl create secret generic mysql-credentials -n demo \
#     --from-literal=MYSQL_ROOT_PASSWORD=root \
#     --from-literal=MYSQL_USER=demo \
#     --from-literal=MYSQL_PASSWORD=demo \
#     --from-literal=MYSQL_DATABASE=demo
#
# (matches docker-compose.yml's own mysql service — this is a demo project, not real prod
# credentials, but keeping them out of git is still the right habit.)
#
# PVC-backed (not emptyDir, unlike Redis/Kafka): order-service's write model is real relational
# data (orders), losing it on every pod restart would defeat the point of having MySQL at all.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: demo
  labels: { app: mysql }
spec:
  serviceName: mysql
  replicas: 1
  selector: { matchLabels: { app: mysql } }
  template:
    metadata: { labels: { app: mysql } }
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports: [{ containerPort: 3306 }]
          envFrom:
            - secretRef: { name: mysql-credentials }
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          readinessProbe:
            exec: { command: ["mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$(MYSQL_ROOT_PASSWORD)"] }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$(MYSQL_ROOT_PASSWORD)"] }
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: demo
spec:
  selector: { app: mysql }
  ports: [{ name: mysql, port: 3306, targetPort: 3306 }]
---
# One-shot: creates the demo_qa database + grants, the same manual step docker-compose.qa.yml's
# header comment documents for the host-based setup. Safe to re-run (CREATE DATABASE IF NOT
# EXISTS / GRANT are both idempotent) — set as a Job so it naturally runs once per apply and
# records completion, rather than needing to remember to run it by hand.
apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-create-qa-db
  namespace: demo
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mysql-create-qa-db
          image: mysql:8.4
          envFrom:
            - secretRef: { name: mysql-credentials }
          command:
            - sh
            - -c
            - |
              until mysqladmin ping -h mysql -uroot -p"$MYSQL_ROOT_PASSWORD" >/dev/null 2>&1; do
                echo "waiting for mysql..."; sleep 3
              done
              mysql -h mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e \
                "CREATE DATABASE IF NOT EXISTS demo_qa; GRANT ALL PRIVILEGES ON demo_qa.* TO '$MYSQL_USER'@'%'; FLUSH PRIVILEGES;"
              echo "demo_qa database ready"
