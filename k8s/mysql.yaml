# In-cluster MySQL for the demo namespace. This branch has no demo-qa counterpart namespace (that
# only exists on the testing/main branches — see their own k8s/mysql.yaml for the cross-namespace
# sharing model used there), so this is just a single-namespace instance, no mysql-create-qa-db
# Job needed.
#
# Credentials come from a Secret created imperatively, NOT committed here — same pattern as
# ghcr-pull-secret and the vault-token Secret (see configmap-common.yaml's comment):
#
#   kubectl create secret generic mysql-credentials -n demo \
#     --from-literal=MYSQL_ROOT_PASSWORD=root \
#     --from-literal=MYSQL_USER=demo \
#     --from-literal=MYSQL_PASSWORD=demo \
#     --from-literal=MYSQL_DATABASE=demo
#
# (matches docker-compose.yml's own mysql service — this is a demo project, not real prod
# credentials, but keeping them out of git is still the right habit.)
#
# PVC-backed (not emptyDir, unlike Redis/Kafka): order-service's write model is real relational
# data (orders), losing it on every pod restart would defeat the point of having MySQL at all.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: demo
  labels: { app: mysql }
spec:
  serviceName: mysql
  replicas: 1
  selector: { matchLabels: { app: mysql } }
  template:
    metadata: { labels: { app: mysql } }
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports: [{ containerPort: 3306 }]
          envFrom:
            - secretRef: { name: mysql-credentials }
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          # timeoutSeconds explicit (not the 1s default) — see k8s/mongo.yaml's comment; same
          # exec-probe-under-1s-default fragility applies to any exec probe, not just mongosh.
          readinessProbe:
            exec: { command: ["mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$(MYSQL_ROOT_PASSWORD)"] }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: { command: ["mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$(MYSQL_ROOT_PASSWORD)"] }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: demo
spec:
  selector: { app: mysql }
  ports: [{ name: mysql, port: 3306, targetPort: 3306 }]
