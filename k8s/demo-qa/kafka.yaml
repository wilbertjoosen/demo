# In-cluster Kafka (KRaft, single broker+controller node) for the demo-qa namespace. Previously
# QA pods reached the host's kafka-qa container (docker-compose.qa.yml) over its dedicated
# PLAINTEXT_K8S listener via host.k3d.internal:9194 — the same cross-boundary pattern prod used
# for demo-kafka too (see docker-compose.yml's redis comment for why that split is going away).
# This Deployment replaces that hop for QA: pods resolve it in-cluster as "kafka" (ClusterIP
# Service, below), which is what k8s/configmap-common.yaml's KAFKA_BOOTSTRAP_SERVERS now points
# at. docker-compose.qa.yml's kafka-qa container is untouched and still useful for host-JVM
# debugging (kcat, a local IDE run) against QA on localhost:9192 — its PLAINTEXT_K8S listener is
# just dead weight now, since nothing reaches it from the cluster anymore.
#
# Single listener, not the three-listener split docker-compose uses: there's no separate
# "host debugging this exact broker" concern to plan for from inside the cluster, so
# PLAINTEXT/CONTROLLER is enough. emptyDir, not a PVC: QA topics are recreated from scratch by
# each service's own listener config on startup, and losing in-flight saga messages on a pod
# restart is an acceptable, already-true-today tradeoff for this demo (same "throwaway" reasoning
# as Vault dev-mode and this file's own Redis sibling).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: demo-qa
  labels: { app: kafka }
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          ports: [{ containerPort: 9092 }]
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
          resources:
            requests: { cpu: "250m", memory: "640Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          readinessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 40
            periodSeconds: 20
      volumes:
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: demo-qa
spec:
  selector: { app: kafka }
  ports: [{ name: kafka, port: 9092, targetPort: 9092 }]
