# QA gets its own Mongo databases on the shared prod instance — one strategic-merge patch per
# service, env list merges by `name` so only MONGO_DB is touched. order-service is a Rollout, the
# rest Deployments; the container name equals the service name in every ../demo manifest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: demo
spec:
  template:
    spec:
      containers:
        - name: chat-service
          env:
            - name: MONGO_DB
              value: chat_qa
---
