# QA gets its own Mongo databases on the shared prod instance — one strategic-merge patch per
# Deployment, env list merges by `name` so only MONGO_DB is touched (container name == service
# name in every ../demo manifest). order-service is a Rollout (a CRD) — Kustomize has no
# merge-strategy for a CRD's containers list, so a strategic-merge patch would replace the whole
# list and drop the image. It gets a JSON6902 patch in kustomization.yaml instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: demo
spec:
  template:
    spec:
      containers:
        - name: chat-service
          env:
            - name: MONGO_DB
              value: chat_qa
---
