apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: demo
  labels: { app: config-server, monitored: "true" }
spec:
  replicas: 1
  selector: { matchLabels: { app: config-server } }
  template:
    metadata: { labels: { app: config-server, monitored: "true" } }
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: config-server
          image: ghcr.io/wilbertjoosen/demo-config-server:1c1f75de64d0e741f3a862e2231654dca292204d
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8888 }]
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "384Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8888 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8888 }
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: demo
  labels: { monitored: "true" }
spec:
  selector: { app: config-server }
  ports: [{ name: http, port: 8888, targetPort: 8888 }]
