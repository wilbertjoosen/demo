apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: demo
  labels: { app: chat-service, monitored: "true" }
spec:
  replicas: 1
  selector: { matchLabels: { app: chat-service } }
  template:
    metadata: { labels: { app: chat-service, monitored: "true" } }
    spec:
      containers:
        - name: chat-service
          image: demo/chat-service:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8094 }]
          envFrom:
            - configMapRef: { name: demo-common-config }
          env:
            - { name: EUREKA_INSTANCE_HOSTNAME, value: chat-service }
            - { name: MONGO_DB, value: chat }
          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits: { cpu: "750m", memory: "640Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8094 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8094 }
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: demo
  labels: { monitored: "true" }
spec:
  selector: { app: chat-service }
  ports: [{ name: http, port: 8094, targetPort: 8094 }]
