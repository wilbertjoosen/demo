# mongos — the query router every service actually connects to (MONGO_HOST in
# k8s/demo/configmap-common.yaml and k8s/demo-qa/configmap-common.yaml points here now, not at a
# shard or the config servers directly). Stateless — mongos holds no data of its own, just a cached
# copy of the config servers' metadata — so this is a Deployment, not a StatefulSet, and 2 replicas
# behind a normal ClusterIP Service is plain HA, no membership/quorum concerns the way the
# StatefulSets in this directory have.
#
# --configdb points at mongo-configsvr's 3 stable per-pod DNS names (mongo-cluster-init-job.yaml
# initiates that replica set — mongos will crash-loop until it has a primary to talk to, which is
# expected and self-resolves once that Job completes, same "retry until reachable" tolerance as the
# rest of this cluster's init ordering).
apiVersion: v1
kind: Service
metadata:
  name: mongos
  namespace: infra
  labels: { app: mongos }
spec:
  selector: { app: mongos }
  ports: [{ name: mongo, port: 27017, targetPort: 27017 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongos
  namespace: infra
  labels: { app: mongos }
spec:
  replicas: 2
  selector: { matchLabels: { app: mongos } }
  template:
    metadata: { labels: { app: mongos } }
    spec:
      containers:
        - name: mongos
          image: mongo:7
          command:
            - mongos
            - --configdb
            - configsvr0/mongo-configsvr-0.mongo-configsvr-headless.infra.svc.cluster.local:27019,mongo-configsvr-1.mongo-configsvr-headless.infra.svc.cluster.local:27019,mongo-configsvr-2.mongo-configsvr-headless.infra.svc.cluster.local:27019
            - --bind_ip_all
          ports: [{ containerPort: 27017 }]
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          startupProbe:
            tcpSocket: { port: 27017 }
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            exec: { command: ["mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"] }
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket: { port: 27017 }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
