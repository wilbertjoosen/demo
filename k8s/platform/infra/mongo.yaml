# In-cluster MongoDB (3-node replica set), in the infra namespace (k8s/namespace-infra.yaml) —
# shared cross-namespace with
# demo-qa the same way MySQL/Keycloak/Vault are (k8s/mysql.yaml, k8s/keycloak.yaml, k8s/vault.yaml)
# — QA gets its own database names, not a duplicate replica set.
#
# StatefulSet + headless Service, not a Deployment: each replica needs a stable network identity
# (mongo-0/mongo-1/mongo-2, each with its own PVC) for the replica set to address its members
# consistently. Unlike the host setup — where members had to be addressed as host.docker.internal
# (the one name reachable from containers, host-JVM processes, and k8s pods alike, but NOT from
# the host machine itself, which is exactly what broke local dev — see the git history around
# start-local.sh's Mongo fix) — in-cluster members get proper, directly-addressable per-pod DNS
# (mongo-0.mongo-headless.infra.svc.cluster.local etc.), so there's no equivalent host-resolution
# problem to design around here.
apiVersion: v1
kind: Service
metadata:
  name: mongo-headless
  namespace: infra
  labels: { app: mongo }
spec:
  clusterIP: None
  selector: { app: mongo }
  ports: [{ name: mongo, port: 27017, targetPort: 27017 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: infra
  labels: { app: mongo }
spec:
  serviceName: mongo-headless
  replicas: 3
  selector: { matchLabels: { app: mongo } }
  template:
    metadata: { labels: { app: mongo } }
    spec:
      containers:
        - name: mongo
          image: mongo:7
          command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
          ports: [{ containerPort: 27017 }]
          volumeMounts:
            - { name: data, mountPath: /data/db }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          # timeoutSeconds explicit (not the 1s default): mongosh is a Node.js CLI with real
          # process-startup overhead of its own, which regularly exceeds 1s under any scheduling
          # jitter at all — the 1s default was causing genuine false-positive probe failures
          # (confirmed live: kubelet killing/restarting the pod on "command timed out" even though
          # the node's actual CPU/memory usage was low single digits, not real contention).
          # startupProbe + tcpSocket liveness: a mass app rollout (every service restarting at once
          # on this single node) spikes CPU enough that spawning mongosh can't finish inside any
          # sane timeout — that was killing/restarting all three replicas at once, collapsing the
          # replica set. Liveness now just checks the port is open (mongod alive); the real
          # replica-set ping stays on readiness, which only pulls the pod from Service endpoints,
          # it doesn't SIGTERM it.
          startupProbe:
            tcpSocket: { port: 27017 }
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            exec: { command: ["mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"] }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket: { port: 27017 }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 2Gi }
---
# No separate non-headless Service: MONGO_HOST (k8s/configmap-common.yaml) lists all three
# headless per-pod DNS names directly, plus MONGO_REPLICA_SET_PARAM=?replicaSet=rs0 — the driver's
# own replica-set awareness is what finds the actual primary, same as the host setup already did.
# A single-VIP Service would just add an unnecessary hop for something the driver already handles.
#
# One-shot: initiates the replica set using the headless Service's stable per-pod DNS names as
# members. Safe to re-run (rs.initiate() on an already-initiated set just errors, caught below).
apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-rs-init
  namespace: infra
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mongo-rs-init
          image: mongo:7
          command:
            - bash
            - -c
            - |
              for host in mongo-0.mongo-headless mongo-1.mongo-headless mongo-2.mongo-headless; do
                until mongosh --host "$host" --quiet --eval "db.runCommand({ping:1})" >/dev/null 2>&1; do
                  echo "waiting for $host..."; sleep 2
                done
              done
              mongosh --host mongo-0.mongo-headless --quiet --eval '
                try {
                  rs.initiate({
                    _id: "rs0",
                    members: [
                      { _id: 0, host: "mongo-0.mongo-headless.infra.svc.cluster.local:27017" },
                      { _id: 1, host: "mongo-1.mongo-headless.infra.svc.cluster.local:27017" },
                      { _id: 2, host: "mongo-2.mongo-headless.infra.svc.cluster.local:27017" }
                    ]
                  });
                  print("replica set initiated");
                } catch (e) {
                  print("replica set already initiated (or init failed): " + e);
                }
              '
