# One-shot cluster bring-up, in dependency order: initiate the config server replica set, initiate
# each shard's replica set, then (once mongos has something to route to) register both shards and
# shard the two highest-write collections this cluster actually has — inventory-service's
# `inventory` (reserve/release/addStock on every order) and order-service's `order-view` (the CQRS
# read side, kept in sync by the same saga events on every order status change).
#
# Shard keys deliberately demonstrate two different strategies:
#   - inventory: {productId: 1, warehouseId: 1} — ranged/compound, the collection's own natural
#     composite key (see InventoryItem's javadoc) — productId already distributes reasonably, no
#     need to hash it, and a ranged key keeps a single product's warehouse lines chunk-adjacent.
#   - order-view: {keycloakUserId: "hashed"} — hashed, because keycloakUserId is the natural
#     query key (findByKeycloakUserIdAndDeletedFalse) but isn't guaranteed to distribute evenly on
#     its own; hashing spreads writes across both shards regardless of the actual ID values.
#
# Safe to re-run in full: every step either checks for existing state first or catches the
# already-done error, same pattern as the original mongo-rs-init Job this one replaces.
#
# Incident (2026-08-31): a mass pod restart corrupted the configsvr replica set's own local.*
# state, so this Job was re-run to recover it. Its addShard step failed for shard1rs (a stale
# empty database on shard0 collided by name with shard1's real data) but the catch-and-print
# swallowed it — the Job still reported 1/1 Complete, and every database that actually lived on
# shard1 became silently invisible via mongos (not deleted, just unrouted) in both demo and
# demo-qa, for every service, until discovered by chance. `set -e` + rethrowing anything that
# isn't the specific already-done error, plus the shard-count assertion at the very end, are here
# so the next occurrence fails this Job loudly (kubectl get jobs -n infra shows it) instead of
# quietly degrading half the cluster's data.
#
# ArgoCD hook, not a plain synced resource (same reasoning as monitoring/kibana.yaml's
# kibana-dashboard-init): a Job's spec.template is immutable, so once ArgoCD has applied this
# once, every later sync of this file (already listed as a plain resource in this folder's
# kustomization.yaml) tries to patch the completed Job in place and fails with "field is
# immutable" — invisibly, since nothing else here depends on this Job succeeding on any given
# sync. hook-delete-policy: BeforeHookCreation makes ArgoCD delete the previous run and create a
# fresh one each sync instead of patching. PostSync (not PreSync) because this Job's own wait_for
# retry loops already handle "the StatefulSets aren't ready yet" — it doesn't need ArgoCD to
# sequence anything for it, just to stop trying to patch a finished Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-cluster-init
  namespace: infra
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mongo-cluster-init
          image: mongo:7
          command:
            - bash
            - -c
            - |
              set -euo pipefail

              wait_for() {
                until mongosh --host "$1" --port "$2" --quiet --eval "db.runCommand({ping:1})" >/dev/null 2>&1; do
                  echo "waiting for $1:$2..."; sleep 2
                done
              }

              for host in mongo-configsvr-0.mongo-configsvr-headless mongo-configsvr-1.mongo-configsvr-headless mongo-configsvr-2.mongo-configsvr-headless; do
                wait_for "$host" 27019
              done
              mongosh --host mongo-configsvr-0.mongo-configsvr-headless --port 27019 --quiet --eval '
                try {
                  rs.initiate({
                    _id: "configsvr0",
                    configsvr: true,
                    members: [
                      { _id: 0, host: "mongo-configsvr-0.mongo-configsvr-headless.infra.svc.cluster.local:27019" },
                      { _id: 1, host: "mongo-configsvr-1.mongo-configsvr-headless.infra.svc.cluster.local:27019" },
                      { _id: 2, host: "mongo-configsvr-2.mongo-configsvr-headless.infra.svc.cluster.local:27019" }
                    ]
                  });
                  print("configsvr0 initiated");
                } catch (e) {
                  if (!String(e).includes("already initialized")) { throw e; }
                  print("configsvr0 already initiated");
                }
              '

              for host in mongo-shard0-0.mongo-shard0-headless mongo-shard0-1.mongo-shard0-headless; do
                wait_for "$host" 27018
              done
              mongosh --host mongo-shard0-0.mongo-shard0-headless --port 27018 --quiet --eval '
                try {
                  rs.initiate({
                    _id: "shard0rs",
                    members: [
                      { _id: 0, host: "mongo-shard0-0.mongo-shard0-headless.infra.svc.cluster.local:27018" },
                      { _id: 1, host: "mongo-shard0-1.mongo-shard0-headless.infra.svc.cluster.local:27018" }
                    ]
                  });
                  print("shard0rs initiated");
                } catch (e) {
                  if (!String(e).includes("already initialized")) { throw e; }
                  print("shard0rs already initiated");
                }
              '

              for host in mongo-shard1-0.mongo-shard1-headless mongo-shard1-1.mongo-shard1-headless; do
                wait_for "$host" 27018
              done
              mongosh --host mongo-shard1-0.mongo-shard1-headless --port 27018 --quiet --eval '
                try {
                  rs.initiate({
                    _id: "shard1rs",
                    members: [
                      { _id: 0, host: "mongo-shard1-0.mongo-shard1-headless.infra.svc.cluster.local:27018" },
                      { _id: 1, host: "mongo-shard1-1.mongo-shard1-headless.infra.svc.cluster.local:27018" }
                    ]
                  });
                  print("shard1rs initiated");
                } catch (e) {
                  if (!String(e).includes("already initialized")) { throw e; }
                  print("shard1rs already initiated");
                }
              '

              # mongos itself only comes up once configsvr0 has a primary — give it the same
              # retry treatment rather than assuming it's already there.
              wait_for mongos.infra.svc.cluster.local 27017

              mongosh --host mongos.infra.svc.cluster.local --port 27017 --quiet --eval '
                // A shard already being a member is silently idempotent (addShard just returns
                // ok:1, no exception) - so anything this DOES catch is a real failure (e.g. a
                // stale/empty database on one shard colliding by name with real data on another,
                // see the 2026-08-31 incident above). Never swallow it.
                function addShard(rsName, hosts) {
                  sh.addShard(rsName + "/" + hosts);
                  print(rsName + " added (or already a member)");
                }
                addShard("shard0rs", "mongo-shard0-0.mongo-shard0-headless.infra.svc.cluster.local:27018,mongo-shard0-1.mongo-shard0-headless.infra.svc.cluster.local:27018");
                addShard("shard1rs", "mongo-shard1-0.mongo-shard1-headless.infra.svc.cluster.local:27018,mongo-shard1-1.mongo-shard1-headless.infra.svc.cluster.local:27018");

                // Belt-and-suspenders: even if addShard above somehow failed without throwing,
                // catch it here rather than let the rest of the script (and the app services
                // depending on this cluster) silently run against a half-registered topology.
                const shardCount = db.adminCommand({ listShards: 1 }).shards.length;
                if (shardCount !== 2) {
                  throw new Error("Expected 2 registered shards after addShard, found " + shardCount +
                    " - check for a database name collision between shard0 and shard1 (see the 2026-08-31 incident comment above)");
                }
                print("shard count verified: " + shardCount);

                function shardInventory(dbName) {
                  sh.enableSharding(dbName);
                  db.getSiblingDB(dbName).inventory.createIndex({ productId: 1, warehouseId: 1 });
                  try {
                    sh.shardCollection(dbName + ".inventory", { productId: 1, warehouseId: 1 });
                    print(dbName + ".inventory sharded");
                  } catch (e) {
                    if (!String(e).includes("already")) { throw e; }
                    print(dbName + ".inventory already sharded");
                  }
                }
                function shardOrderView(dbName) {
                  sh.enableSharding(dbName);
                  db.getSiblingDB(dbName)["order-view"].createIndex({ keycloakUserId: "hashed" });
                  try {
                    sh.shardCollection(dbName + ".order-view", { keycloakUserId: "hashed" });
                    print(dbName + ".order-view sharded");
                  } catch (e) {
                    if (!String(e).includes("already")) { throw e; }
                    print(dbName + ".order-view already sharded");
                  }
                }

                // demo (production) and demo-qa each get their own DB names on this same shared
                // cluster (k8s/demo-qa/patches/mongo-db-names.yaml), so both need sharding.
                shardInventory("inventory");
                shardInventory("inventory_qa");
                shardOrderView("orders");
                shardOrderView("orders_qa");
              '
