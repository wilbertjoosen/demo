# In-cluster Keycloak, in the infra namespace (k8s/namespace-infra.yaml) — shared across prod and
# QA the same way it already
# is on the host (one Keycloak server, two realms: "demo" and "demo-qa" — see docker-compose.qa.yml's
# comment). The realm-import ConfigMap below embeds both docker/keycloak/realm-demo.json and
# realm-demo-qa.json verbatim (Keycloak's --import-realm scans the whole mounted directory, same
# as docker-compose.yml's volume mount) — keep these two in sync by hand if the source files change.
#
# THE hostPort/nodeSelector BELOW ARE LOAD-BEARING, NOT COSMETIC: every service's
# KEYCLOAK_ISSUER_URI (and the frontend's) is hardcoded to http://localhost:8081 — the `iss` claim
# Keycloak puts in every token has to equal that exact string for every service's
# JwtIssuerValidator to accept it, browser or server-to-server alike (see docker-compose.yml's own
# keycloak comment for the full reasoning; KC_HOSTNAME below is what fixes the issuer to that
# value regardless of which URL actually reached this pod). The k3d cluster is created with
# `-p "8081:8081@loadbalancer"` specifically for this (see README's Kubernetes/GitOps section) —
# k3d's loadbalancer forwards host:8081 to port 8081 on every node, so this Deployment binds
# hostPort 8081 and is pinned (nodeSelector) to k3d-demo-server-0 specifically, so there's always
# exactly one real listener for the loadbalancer to reach rather than a 1-in-3 chance of hitting a
# node with nothing bound there. Other in-cluster pods reach Keycloak directly via the ClusterIP
# Service on its normal port 8080 instead (see k8s/configmap-common.yaml's KEYCLOAK_JWK_SET_URI/
# TOKEN_URI/ADMIN_URI) — only KEYCLOAK_ISSUER_URI itself needs the external, browser-reachable
# localhost:8081 address; everything else is more efficient going straight through the cluster.
#
# PVC-backed (not emptyDir): Keycloak's own H2 database holds any user/session state created at
# runtime beyond what the realm-import JSON seeds (confirmed real drift existed on the host
# instance before this migration — see backups/README.md) — losing it on every pod restart would
# be a real regression from how the host container behaved (implicitly persisted via the
# container's own writable layer, as long as it wasn't recreated).
