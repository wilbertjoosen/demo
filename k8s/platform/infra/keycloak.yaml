kind: ConfigMap
metadata:
  name: keycloak-realm-import
  namespace: infra
---
# "demo" login theme — see docker/keycloak/themes/demo (same files, mounted here via ConfigMap
# instead of a bind mount) for the theme's own reasoning comment. `items:` reconstructs the
# theme's on-disk subdirectory layout (theme.properties at login/, styles.css one level deeper
# at login/resources/css/) from this single ConfigMap's two flat keys. Shared by both realms
# above (both set loginTheme: "demo") since this is one Keycloak instance for both.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-theme-demo
  namespace: infra
data:
  theme.properties: |
    parent=keycloak.v2
    import=common/keycloak

    styles=css/styles.css
  styles.css: |
    @import url("../../keycloak.v2/css/styles.css");

    /* !important below is load-bearing: PatternFly v5 ships a zero-specificity
       `:where(.pf-v5-theme-dark) { ... }` block that redefines these same --pf-v5-global--*
       variables for dark mode, and it wins a specificity tie against a plain :root rule on
       source order alone. !important is the only thing that isn't out-specificity'd by that
       block, since PatternFly's own variable definitions never use !important. Confirmed live
       in a real dark-mode browser session: without this, the button/link/focus colors silently
       reverted to PatternFly's defaults while every other selector in this file still worked. */
    :root {
        --pf-v5-global--primary-color--100: #409eff !important;
        --pf-v5-global--primary-color--200: #3a8ee6 !important;
        --pf-v5-global--primary-color--300: #409eff !important;
        --pf-v5-global--primary-color--400: #ffffff !important;
        --pf-v5-global--primary-color--light-100: #409eff !important;
        --pf-v5-global--primary-color--dark-100: #409eff !important;
        --pf-v5-global--link--Color: #409eff !important;
        --pf-v5-global--link--Color--hover: #3a8ee6 !important;
        --pf-v5-global--link--Color--light: #409eff !important;
        --pf-v5-global--link--Color--light--hover: #3a8ee6 !important;
        --pf-v5-global--link--Color--dark: #409eff !important;
        --pf-v5-global--link--Color--dark--hover: #3a8ee6 !important;
        --keycloak-card-top-color: #409eff !important;
    }

    .login-pf body {
        background: linear-gradient(160deg, #ecf5ff 0%, #ffffff 55%);
    }

    /* This theme is light-only by design — PatternFly's dark theme reassigns the login card, form
       controls, and header/footer text to component-scoped variables that bypass the
       --pf-v5-global--* tokens above entirely, so token overrides alone can't reach them. Setting
       the rendered background-color/color directly wins regardless of which token chain produced
       the losing value. Confirmed live: without this the card, labels, and inputs stayed dark. */
    .login-pf .pf-v5-c-login__main {
        background-color: #ffffff !important;
    }

    .login-pf .pf-v5-c-login__header,
    .login-pf .pf-v5-c-login__main-body,
    .login-pf .pf-v5-c-login__main-footer,
    .login-pf .pf-v5-c-login__footer {
        color: #151515 !important;
    }

    .login-pf .pf-v5-c-form-control {
        background-color: #ffffff !important;
        color: #151515 !important;
    }

    /* The password show/hide toggle is a separate "control"-variant button, not part of
       .pf-v5-c-form-control itself, so it needs its own override. */
    .login-pf .pf-v5-c-button.pf-m-control {
        background-color: #ffffff !important;
        color: #6a6e73 !important;
    }

    /* color needs !important too: the base keycloak.v2 theme's own #kc-header-wrapper rule sets
       color with !important, which no amount of specificity alone can beat. Confirmed live: the
       header rendered light grey, not purple, until this was added. */
    #kc-header-wrapper.pf-v5-c-brand {
        font-size: 1.75rem;
        font-weight: 700;
        color: #409eff !important;
        letter-spacing: -0.02em;
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: infra
  labels: { app: keycloak }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: keycloak } }
  template:
    metadata: { labels: { app: keycloak } }
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3d-demo-server-0
      containers:
        - name: keycloak
          # Pinned (2026-08-25, matching the exact version already running, confirmed via
          # /realms/master) — not :latest, same reasoning as every other image in this stack after
          # Tempo's :latest incident.
          image: quay.io/keycloak/keycloak:26.7.2
          args: ["start-dev", "--import-realm"]
          ports:
            - { containerPort: 8080, hostPort: 8081, name: http }
          # Native OTel tracing (2026-08-25) — see https://www.keycloak.org/observability/tracing.
          # KC_TRACING_ENABLED is documented as a "build-time" option, but start-dev already runs an
          # implicit build/augmentation on every startup regardless (confirmed live: "Quarkus
          # augmentation completed" appears in the logs either way), so no separate `kc.sh build`
          # step is needed here. Verified end-to-end locally (docker run against a port-forwarded
          # Tempo) before touching this file — real keycloak-service spans (schema migration, realm
          # import) showed up in Tempo's search API. Both KC_TRACING_ENABLED and
          # KC_TRACING_SAMPLER_RATIO come from the keycloak-tracing Secret (imperatively created in
          # this namespace, not committed — same pattern as grafana-admin/mysql-credentials, and the
          # same on/off-via-Secret shape as pyroscope-agent) rather than literals here, so tracing can
          # be toggled or retuned without a git commit — though a pod restart is still needed to pick
          # up a changed value, same limitation as every other envFrom/secretRef in this stack.
          envFrom:
            - secretRef: { name: keycloak-tracing }
          env:
            - { name: KEYCLOAK_ADMIN, value: "admin" }
            - { name: KEYCLOAK_ADMIN_PASSWORD, value: "admin" }
            - { name: KC_HOSTNAME, value: "http://localhost:8081" }
            - { name: KC_TRACING_ENDPOINT, value: "http://tempo.monitoring.svc.cluster.local:4317" }
          volumeMounts:
            - { name: data, mountPath: /opt/keycloak/data/h2 }
            - { name: realm-import, mountPath: /opt/keycloak/data/import }
            - { name: theme-demo, mountPath: /opt/keycloak/themes/demo/login }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          # startupProbe gates liveness until Keycloak has finished booting (realm import can be
          # slow), and liveness gets an explicit timeout (default is 1s — a JVM under a
          # mass-rollout CPU spike blows that and gets SIGTERM'd). 40 x 10s = ~6.5 min boot budget.
          startupProbe:
            httpGet: { path: /realms/demo, port: 8080 }
            failureThreshold: 40
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /realms/demo, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /realms/demo, port: 8080 }
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: keycloak-data }
        - name: realm-import
          configMap: { name: keycloak-realm-import }
        - name: theme-demo
          configMap:
            name: keycloak-theme-demo
            items:
              - { key: theme.properties, path: theme.properties }
              - { key: styles.css, path: resources/css/styles.css }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-data
  namespace: infra
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: infra
spec:
  selector: { app: keycloak }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
