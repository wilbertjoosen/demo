# In-cluster Kibana, in the "monitoring" namespace alongside Loki/Prometheus. Points at the
# ALREADY-existing in-cluster Elasticsearch (k8s/elasticsearch.yaml, "infra" namespace — the
# same shared instance both demo and demo-qa write to) via the same cross-namespace FQDN pattern
# used everywhere else in this split — Kibana itself is just a reader, so it stays in "monitoring"
# rather than "infra". docker-compose's own Kibana/Elasticsearch stay as-is for the host-JVM/IDE
# dev flow, same pattern as every other infra piece already moved in-cluster.
#
# No PVC — Kibana itself is stateless (its saved objects live in Elasticsearch, not on disk), same
# reasoning as k8s/mailpit.yaml having no volume.
#
# kibana-dashboards ConfigMap below holds all three dashboards docker-compose.yml's own
# kibana-dashboard-init imports (see its own comment): audit-trail-dashboard.ndjson (combined
# audit-log* view, both environments together), and the -prod/-qa variants (same panels, each
# pinned to its own exact index instead of relying on a filter). All three generated verbatim from
# docker/kibana/*.ndjson via `kubectl create configmap --from-file --dry-run=client -o yaml` rather
# than hand-transcribed, and diffed byte-for-byte against the source files to confirm.
