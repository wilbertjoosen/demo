kind: ConfigMap
metadata:
  name: kibana-dashboards
  namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: monitoring
  labels: { app: kibana }
spec:
  replicas: 1
  selector: { matchLabels: { app: kibana } }
  template:
    metadata: { labels: { app: kibana } }
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:9.1.0
          ports: [{ containerPort: 5601 }]
          env:
            - { name: ELASTICSEARCH_HOSTS, value: "http://elasticsearch.infra.svc.cluster.local:9200" }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          readinessProbe:
            httpGet: { path: /api/status, port: 5601 }
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /api/status, port: 5601 }
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: monitoring
spec:
  selector: { app: kibana }
  ports: [{ port: 5601, targetPort: 5601 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kibana-ingress
  namespace: monitoring
spec:
  rules:
    - host: kibana.demo.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: kibana, port: { number: 5601 } }
---
# One-shot import — same three-file loop, same curl command docker-compose.yml's now-removed
# kibana-dashboard-init container used to run (this in-cluster Kibana is the only one left; see
# docker-compose.yml's comment). Jobs have no native "wait for another Deployment's readiness"
# primitive the way docker-compose's `depends_on: condition: service_healthy` did, so an
# initContainer polls Kibana's own /api/status first.
#
# ArgoCD hook, not a plain synced resource: a Job's spec.template is immutable, so once ArgoCD has
# applied this once, every later sync tries to patch the completed Job in place and fails with
# "field is immutable". hook-delete-policy: BeforeHookCreation makes ArgoCD delete the previous
# run and create a fresh one each sync instead of patching — the correct fix for any
# apply-once/immutable-spec resource under GitOps, not something to work around by hand.
apiVersion: batch/v1
kind: Job
metadata:
  name: kibana-dashboard-init
  namespace: monitoring
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-kibana
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              until curl -sf http://kibana:5601/api/status >/dev/null; do
                echo "waiting for kibana..."
                sleep 5
              done
      containers:
        - name: import-dashboards
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              for f in audit-trail-dashboard audit-trail-dashboard-prod audit-trail-dashboard-qa; do
                curl -s -X POST http://kibana:5601/api/saved_objects/_import?overwrite=true \
                  -H 'kbn-xsrf: true' \
                  --form file=@/kibana/$f.ndjson
              done
          volumeMounts:
            - { name: dashboards, mountPath: /kibana }
      volumes:
        - name: dashboards
          configMap: { name: kibana-dashboards }
