server:
  port: 8086

spring:
  application:
    name: payment-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}

  mongodb:
    uri: mongodb://${MONGO_HOST:localhost:27017}/${MONGO_DB:payments}${MONGO_REPLICA_SET_PARAM:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: false

keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak.localhost:8081/realms/demo}
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak.localhost:8081/realms/demo/protocol/openid-connect/certs}

payment:
  # Local-disk storage for customer-uploaded bank transfer/cash receipts — same pattern as
  # product-media-service's media.upload-dir.
  proof-upload-dir: ${PAYMENT_PROOF_UPLOAD_DIR:/tmp/payment-proofs}

management:
  endpoint:
    health:
      probes:
        enabled: true

# CircuitBreaker + TimeLimiter for this same call are already configured programmatically in
# Resilience4jConfig — these three layer on top of that (see PaymentGatewayClient's javadoc).
resilience4j:
  retry:
    instances:
      paymentGateway:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  ratelimiter:
    instances:
      paymentGateway:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 0s
  bulkhead:
    instances:
      paymentGateway:
        max-concurrent-calls: 5
