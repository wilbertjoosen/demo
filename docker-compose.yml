# Shared by every containerized app service below — addresses use in-network service names
# (mongodb, kafka:29092, keycloak's internal port) rather than the localhost:* defaults each
# service's application.yaml falls back to for the `mvn spring-boot:run` host-JVM dev flow.
# KEYCLOAK_ISSUER_URI stays external (keycloak.localhost:8181): it must match the `iss` claim of tokens
# issued to the browser-based SPA, regardless of where the validating service itself runs.
#
# The hostname is `keycloak.localhost`, not bare `localhost` — deliberately: the k3d/k8s stack's own
# Keycloak also answers on `localhost` (port 8081, see k8s/keycloak.yaml), and browser cookies are
# scoped by domain, not port, so two Keycloak instances both fronted by bare `localhost` share one
# cookie jar. In practice that means logging into one instance clobbers the other's `KC_RESTART`/
# session cookies — reproduced live: a login against one instance broke the other's in-flight flow
# with "Restart login cookie not found." `*.localhost` resolves to loopback with no /etc/hosts entry
# needed (same mechanism `demo.localhost` already relies on for the k3d ingress), so this is a free,
# zero-config way to give this instance a distinct cookie-scoping domain and let both environments be
# used in the same browser at once.
x-app-env: &app-env
  CONFIG_SERVER_URI: http://config-server:8888
  EUREKA_URI: http://eureka-server:8761/eureka
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  KEYCLOAK_ISSUER_URI: http://keycloak.localhost:8181/realms/demo
  KEYCLOAK_JWK_SET_URI: http://keycloak:8180/realms/demo/protocol/openid-connect/certs
  MONGO_HOST: mongodb
  REDIS_HOST: redis

services:
  mysql:
    image: mysql:8.4
    container_name: demo-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: demo-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: demo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Dev/host-debug only: k8s pods no longer depend on this container — they have their own
  # in-cluster Kafka now (see k8s/kafka.yaml). This one remains for the local mvnw/IDE dev flow
  # and host-tool debugging (kcat) against localhost:9092.
  kafka:
    image: apache/kafka:3.8.0
    container_name: demo-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Three advertised listeners — a broker's advertised address is baked into every
      # produce/consume response, so each *kind* of client network needs its own: PLAINTEXT
      # (localhost:9092) for JVMs on the host machine (the `mvn spring-boot:run` dev flow);
      # PLAINTEXT_INTERNAL (kafka:29092) for containerized app services in *this* compose file;
      # PLAINTEXT_K8S (host.k3d.internal:9094) for pods in the k3d cluster — k3d's DNS resolves
      # that name to the host, where this same port is also published, but pods can't resolve
      # "localhost" (themselves) or "kafka" (no such name in cluster DNS).
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,PLAINTEXT_K8S://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092,PLAINTEXT_K8S://host.k3d.internal:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_K8S:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: demo-kafka-ui
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: demo
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8095:8080"
    depends_on:
      - kafka

  mailpit:
    image: axllent/mailpit:latest
    container_name: demo-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: demo-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Without a fixed hostname, Keycloak's dev mode derives each token's `iss` claim from
      # whatever Host header the request used to reach it — fine for browser logins (always
      # keycloak.localhost:8181), but order-service's server-to-server client_credentials call goes through
      # host.k3d.internal:8181 when running in the k3d cluster, which would mint a token with a
      # DIFFERENT issuer than what every service's fixed KEYCLOAK_ISSUER_URI expects, and the
      # receiving service's JwtIssuerValidator rejects it with 401.
      KC_HOSTNAME: http://keycloak.localhost:8181
    ports:
      - "8181:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
    container_name: demo-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Dev/host-debug only: k8s pods no longer depend on this container — they have their own
  # in-cluster Redis now (see k8s/redis.yaml). This one remains for the local mvnw/IDE dev flow
  # and host-tool debugging (redis-cli) against localhost:6379.
  redis:
    image: redis:7-alpine
    container_name: demo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # --- App services -----------------------------------------------------------------------
  # Not meant to run alongside the local `mvn spring-boot:run` processes used throughout dev —
  # both bind the same host ports. Run `docker compose up -d mysql mongodb kafka mailpit keycloak
  # elasticsearch redis` for infra-only (the local-JVM flow), or `docker compose up -d --build` for
  # the fully containerized stack.

  eureka-server:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: eureka-server
    container_name: demo-eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"

  config-server:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: config-server
    container_name: demo-config-server
    restart: unless-stopped
    ports:
      - "8888:8888"

  gateway-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: gateway-service
    container_name: demo-gateway-service
    restart: unless-stopped
    environment:
      <<: *app-env
      EUREKA_INSTANCE_HOSTNAME: gateway-service
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
      - config-server

  audit-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: audit-service
    container_name: demo-audit-service
    restart: unless-stopped
    environment:
      <<: *app-env
      EUREKA_INSTANCE_HOSTNAME: audit-service
      ELASTICSEARCH_URI: http://elasticsearch:9200
    ports:
      - "8090:8090"
    depends_on:
      - eureka-server
      - config-server
      - kafka
      - elasticsearch

  user-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: user-service
    container_name: demo-user-service
    restart: unless-stopped
    environment:
      <<: *app-env
      EUREKA_INSTANCE_HOSTNAME: user-service
      MONGO_DB: users
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/demo/protocol/openid-connect/token
      KEYCLOAK_ADMIN_URI: http://keycloak:8080/admin/realms/demo
    ports:
      - "8082:8082"
    depends_on:
      - eureka-server
      - config-server
      - mongodb
      - kafka
      - keycloak

  product-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: product-service
    container_name: demo-product-service
    restart: unless-stopped
    environment:
      <<: *app-env
      EUREKA_INSTANCE_HOSTNAME: product-service
      MONGO_DB: products
    ports:
      - "8083:8083"
    depends_on:
      - eureka-server
      - config-server
      - mongodb
      - kafka
      - keycloak
      - redis

  order-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: order-service
    container_name: demo-order-service
    restart: unless-stopped
    environment:
      <<: *app-env
      EUREKA_INSTANCE_HOSTNAME: order-service
      MONGO_DB: orders
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: demo
      DB_USERNAME: demo
      DB_PASSWORD: demo
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/demo/protocol/openid-connect/token
      INVENTORY_SERVICE_URI: http://inventory-service:8089
    ports:
      - "8084:8084"
    depends_on:
      - eureka-server
      - config-server
      - mysql
      - mongodb
      - kafka
      - keycloak

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: payment-service
    container_name: demo-payment-service
    restart: unless-stopped
    environment:
      <<: *app-env
      EUREKA_INSTANCE_HOSTNAME: payment-service
      MONGO_DB: payments
    ports:
      - "8086:8086"
    depends_on:
      - eureka-server
      - config-server
      - mongodb
      - kafka
      - keycloak

  shipping-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: shipping-service
    container_name: demo-shipping-service
    restart: unless-stopped
    environment:
      <<: *app-env
      EUREKA_INSTANCE_HOSTNAME: shipping-service
      MONGO_DB: shipments
    ports:
      - "8088:8088"
    depends_on:
      - eureka-server
      - config-server
      - mongodb
      - kafka
      - keycloak

  delivery-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: delivery-service
    container_name: demo-delivery-service
    restart: unless-stopped
    environment:
      <<: *app-env
      EUREKA_INSTANCE_HOSTNAME: delivery-service
      MONGO_DB: deliveries
    ports:
      - "8087:8087"
    depends_on:
      - eureka-server
      - config-server
      - mongodb
      - kafka
      - keycloak

  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: inventory-service
    container_name: demo-inventory-service
    restart: unless-stopped
    environment:
      <<: *app-env
      EUREKA_INSTANCE_HOSTNAME: inventory-service
      MONGO_DB: inventory
    ports:
      - "8089:8089"
    depends_on:
      - eureka-server
      - config-server
      - mongodb
      - kafka
      - keycloak
      - redis

  product-comment-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: product-comment-service
    container_name: demo-product-comment-service
    restart: unless-stopped
    environment:
      <<: *app-env
      EUREKA_INSTANCE_HOSTNAME: product-comment-service
      MONGO_DB: comments
    ports:
      - "8091:8091"
    depends_on:
      - eureka-server
      - config-server
      - mongodb
      - kafka
      - keycloak

  common-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: common-service
    container_name: demo-common-service
    restart: unless-stopped
    environment:
      <<: *app-env
      EUREKA_INSTANCE_HOSTNAME: common-service
      MONGO_DB: reference
    ports:
      - "8097:8097"
    depends_on:
      - eureka-server
      - config-server
      - mongodb
      - kafka
      - keycloak

  product-media-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: product-media-service
    container_name: demo-product-media-service
    restart: unless-stopped
    environment:
      <<: *app-env
      EUREKA_INSTANCE_HOSTNAME: product-media-service
      MONGO_DB: media
      MEDIA_UPLOAD_DIR: /data/media-uploads
    volumes:
      - media_uploads:/data/media-uploads
    ports:
      - "8092:8092"
    depends_on:
      - eureka-server
      - config-server
      - mongodb
      - kafka
      - keycloak

  product-review-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: product-review-service
    container_name: demo-product-review-service
    restart: unless-stopped
    environment:
      <<: *app-env
      EUREKA_INSTANCE_HOSTNAME: product-review-service
      MONGO_DB: reviews
    ports:
      - "8093:8093"
    depends_on:
      - eureka-server
      - config-server
      - mongodb
      - kafka
      - keycloak

  chat-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: chat-service
    container_name: demo-chat-service
    restart: unless-stopped
    environment:
      <<: *app-env
      EUREKA_INSTANCE_HOSTNAME: chat-service
      MONGO_DB: chat
    ports:
      - "8094:8094"
    depends_on:
      - eureka-server
      - config-server
      - mongodb
      - kafka
      - keycloak

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: notification-service
    container_name: demo-notification-service
    restart: unless-stopped
    environment:
      <<: *app-env
      EUREKA_INSTANCE_HOSTNAME: notification-service
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    ports:
      - "8085:8085"
    depends_on:
      - eureka-server
      - config-server
      - kafka
      - mailpit
      - keycloak

  frontend:
    build:
      context: ./frontend
    container_name: demo-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - gateway-service

volumes:
  mysql_data:
  mongo_data:
  elasticsearch_data:
  redis_data:
  media_uploads:
