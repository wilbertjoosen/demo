# Shared by every containerized app service below — addresses use in-network service names
# (kafka:29092, keycloak's internal port) rather than the localhost:* defaults each service's
# application.yaml falls back to for the `mvn spring-boot:run` host-JVM dev flow.
# KEYCLOAK_ISSUER_URI stays external (keycloak.localhost:8081): it must match the `iss` claim of tokens
# issued to the browser-based SPA, regardless of where the validating service itself runs.
#
# The hostname is `keycloak.localhost`, not bare `localhost` — deliberately: this container and the
# k3d/k8s cluster's own in-cluster Keycloak (main's k8s/keycloak.yaml, shared cross-namespace by
# `demo`/`demo-qa` — see k8s/configmap-common.yaml) both used to answer on literal `localhost:8081`,
# the exact same port, not just the same domain on different ports. Browser cookies are scoped by
# domain, not port, so the two instances shared one cookie jar and stomped on each other's
# `KC_RESTART`/session cookies whenever both were used in the same browser at once — same failure
# reproduced and fixed this same way on `develop` (there the ports genuinely differed, 8181 vs 8081,
# but cookie scoping doesn't care). `*.localhost` resolves to loopback with no /etc/hosts entry
# needed. Scoped to this container only — the k8s-facing Keycloak (k8s/keycloak.yaml,
# k8s/configmap-common.yaml, and this README's admin-console docs) deliberately keeps answering on
# plain `localhost:8081`; that's real, load-bearing, deployed-cluster identity, not something to
# rename as a side effect of fixing local dev's cookie collision.
#
# MONGO_HOST/MONGO_REPLICA_SET_PARAM (task #74, HA for stateful stores): every consumer — this
# compose network, k8s pods, and any other Docker Desktop container — reaches the 3-node replica
# set the same way, through host.docker.internal at each member's own published port, because
# that's the ONE identity actually baked into the replica set's own config (see mongo-rs-init
# below) — a driver that first connects via a compose-internal name like "mongo1" still gets told
# by the replica set itself that the real members live at host.docker.internal:2701{7,8,9}, so
# using anything else as the steady-state address would just be a seed that immediately gets
# corrected. host.docker.internal resolves automatically in every container on Docker Desktop
# (verified: also reachable from k8s pods, since k3d's own nodes are themselves Docker Desktop
# containers) — no extra_hosts needed here, only on Linux hosts (not this setup).
x-app-env: &app-env
  CONFIG_SERVER_URI: http://config-server:8888
  EUREKA_URI: http://eureka-server:8761/eureka
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  KEYCLOAK_ISSUER_URI: http://keycloak.localhost:8081/realms/demo
  KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/demo/protocol/openid-connect/certs
  MONGO_HOST: host.docker.internal:27017,host.docker.internal:27018,host.docker.internal:27019
  MONGO_REPLICA_SET_PARAM: "?replicaSet=rs0"
  REDIS_HOST: redis

services:
  mysql:
    image: mysql:8.4
    container_name: demo-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 3-node replica set (task #74, HA for stateful stores) — real automatic primary election and
  # failover, not just replica-set-flavored single-node config. Each member's own published port
  # (27017/27018/27019) is what distinguishes it in the replica set's config below, since all
  # three otherwise resolve to the same host.docker.internal address.
  mongo1:
    image: mongo:7
    container_name: demo-mongo1
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "27017:27017"
    volumes:
      - mongo1_data:/data/db

  mongo2:
    image: mongo:7
    container_name: demo-mongo2
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "27018:27017"
    volumes:
      - mongo2_data:/data/db

  mongo3:
    image: mongo:7
    container_name: demo-mongo3
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "27019:27017"
    volumes:
      - mongo3_data:/data/db

  # One-shot: waits for all 3 mongod processes to accept connections, then initiates the replica
  # set exactly once. Safe to re-run (rs.initiate() on an already-initiated set just errors, which
  # this ignores) — matters because `docker compose up` re-runs this container on every restart.
  mongo-rs-init:
    image: mongo:7
    container_name: demo-mongo-rs-init
    restart: "no"
    depends_on:
      - mongo1
      - mongo2
      - mongo3
    entrypoint: ["bash", "-c"]
    command:
      - |
        until mongosh --host mongo1 --quiet --eval "db.runCommand({ping:1})" >/dev/null 2>&1; do
          echo "waiting for mongo1..."; sleep 2
        done
        mongosh --host mongo1 --quiet --eval '
          try {
            rs.initiate({
              _id: "rs0",
              members: [
                { _id: 0, host: "host.docker.internal:27017" },
                { _id: 1, host: "host.docker.internal:27018" },
                { _id: 2, host: "host.docker.internal:27019" }
              ]
            });
            print("replica set initiated");
          } catch (e) {
            print("replica set already initiated (or init failed): " + e);
          }
        '

  # PLAINTEXT_K8S below is dev/prod-host-transition infra: the demo-qa namespace has already moved
  # to its own in-cluster Kafka (k8s/kafka.yaml) instead of reaching this container via
  # host.k3d.internal, matching this file's redis comment. Prod's k8s manifests (on main, not this
  # branch) should get the equivalent in-cluster Kafka + Redis next, at which point PLAINTEXT_K8S
  # here stops being used by anything and can be dropped.
  kafka:
    image: apache/kafka:3.8.0
    container_name: demo-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Three advertised listeners — a broker's advertised address is baked into every
      # produce/consume response, so each *kind* of client network needs its own: PLAINTEXT
      # (localhost:9092) for JVMs on the host machine (the `mvn spring-boot:run` dev flow);
      # PLAINTEXT_INTERNAL (kafka:29092) for containerized app services in *this* compose file;
      # PLAINTEXT_K8S (host.k3d.internal:9094) for pods in the k3d cluster — k3d's DNS resolves
      # that name to the host, where this same port is also published, but pods can't resolve
      # "localhost" (themselves) or "kafka" (no such name in cluster DNS).
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,PLAINTEXT_K8S://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092,PLAINTEXT_K8S://host.k3d.internal:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_K8S:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: demo-kafka-ui
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: demo
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8099:8080"
    depends_on:
      - kafka

  rancher:
    image: rancher/rancher:latest
    container_name: demo-rancher
    restart: unless-stopped
    privileged: true
    environment:
      CATTLE_BOOTSTRAP_PASSWORD: rancherdemo123
    ports:
      - "9080:80"
      - "9443:443"
    volumes:
      - rancher_data:/var/lib/rancher

  mailpit:
    image: axllent/mailpit:latest
    container_name: demo-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: demo-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Without a fixed hostname, Keycloak's dev mode derives each token's `iss` claim from
      # whatever Host header the request used to reach it — fine for browser logins (always
      # keycloak.localhost:8081), but order-service's server-to-server client_credentials call goes through
      # host.k3d.internal:8081 when running in the k3d cluster, which would mint a token with a
      # DIFFERENT issuer than what every service's fixed KEYCLOAK_ISSUER_URI expects, and the
      # receiving service's JwtIssuerValidator rejects it with 401.
      KC_HOSTNAME: http://keycloak.localhost:8081
    ports:
      - "8081:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import
      - ./docker/keycloak/themes/demo:/opt/keycloak/themes/demo

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
    container_name: demo-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:9.1.0
    container_name: demo-kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana-dashboard-init:
    image: curlimages/curl:latest
    container_name: demo-kibana-dashboard-init
    restart: "no"
    depends_on:
      kibana:
        condition: service_healthy
    volumes:
      - ./docker/kibana:/kibana:ro
    # audit-trail-dashboard.ndjson is the combined view (audit-log* wildcard, both environments
    # together); -prod/-qa are the same panels split into two dashboards, each pinned to its own
    # exact index (audit-log / audit-log-qa) instead of relying on a reader to filter the combined one.
    entrypoint: ["sh", "-c", "for f in audit-trail-dashboard audit-trail-dashboard-prod audit-trail-dashboard-qa; do curl -s -X POST http://kibana:5601/api/saved_objects/_import?overwrite=true -H 'kbn-xsrf: true' --form file=@/kibana/$$f.ndjson; done"]

  # Dev-only: for host-JVM services (./start-local.sh, an IDE run) and for host-tool debugging
  # (redis-cli) against a local instance. Prod and QA k8s namespaces no longer depend on this
  # container — they each run their own in-cluster Redis instead (k8s/redis.yaml), the same way
  # they now run their own in-cluster Kafka (k8s/kafka.yaml) rather than reaching out to
  # demo-kafka/kafka-qa via host.k3d.internal. See k8s/configmap-common.yaml for the QA side of
  # that switch; prod's k8s manifests (not in this branch) get the equivalent change.
  redis:
    image: redis:7-alpine
    container_name: demo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Task #75, real secrets management — dev mode: auto-initialized, auto-unsealed, in-memory
  # storage (nothing persists across a restart, and nothing needs to for a demo). A fixed root
  # token is the accepted simplification here — see order-service's own env block above for why
  # that's fine for a throwaway local instance holding only this demo's own low-stakes credentials.
  vault:
    image: hashicorp/vault:latest
    container_name: demo-vault
    restart: unless-stopped
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: demo-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"

  # One-shot: writes order-service's DB credentials + Keycloak client secret into Vault's KV store
  # at secret/order-service — the path Spring Cloud Vault looks up automatically from
  # spring.application.name. Safe to re-run (`vault kv put` is idempotent).
  vault-init:
    image: hashicorp/vault:latest
    container_name: demo-vault-init
    restart: "no"
    depends_on:
      - vault
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: demo-root-token
    entrypoint: ["sh", "-c"]
    command:
      - |
        until vault status >/dev/null 2>&1; do
          echo "waiting for vault..."; sleep 2
        done
        vault kv put secret/order-service \
          DB_USERNAME=demo \
          DB_PASSWORD=demo \
          ORDER_SERVICE_CLIENT_SECRET=order-service-secret
        echo "order-service secrets written to Vault"

  # Grafana/Prometheus/Loki/Promtail/Tempo all moved in-cluster (main's k8s/grafana.yaml,
  # k8s/prometheus.yaml, k8s/loki.yaml, k8s/promtail-daemonset.yaml, k8s/tempo.yaml) — a single
  # shared instance for both demo (prod) and demo-qa, same reasoning as MySQL/Keycloak/Vault
  # already being one shared instance rather than a per-environment docker-compose copy.
  # docker-compose.yml is now purely the host-JVM/local-dev flow's datastores/broker/mail — it has
  # no observability tooling of its own.

  # --- App services -----------------------------------------------------------------------
  # Not meant to run alongside the local `mvn spring-boot:run` processes used throughout dev —
  # both bind the same host ports. Run `docker compose up -d mysql mongo1 mongo2 mongo3 mongo-rs-init kafka mailpit
  # keycloak elasticsearch redis kibana-dashboard-init kibana` for infra-only (the local-JVM flow),
  # or `docker compose up -d --build` for the fully containerized stack.

  eureka-server:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: eureka-server
    container_name: demo-eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"

  config-server:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: config-server
    container_name: demo-config-server
    restart: unless-stopped
    ports:
      - "8888:8888"

  gateway-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: gateway-service
    container_name: demo-gateway-service
    restart: unless-stopped
    environment:
      <<: *app-env
      EUREKA_INSTANCE_HOSTNAME: gateway-service
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
      - config-server

  audit-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: audit-service
    container_name: demo-audit-service
    restart: unless-stopped
    environment:
      <<: *app-env
      EUREKA_INSTANCE_HOSTNAME: audit-service
      ELASTICSEARCH_URI: http://elasticsearch:9200
    ports:
      - "8090:8090"
    depends_on:
      - eureka-server
      - config-server
      - kafka
      - elasticsearch

  user-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: user-service
    container_name: demo-user-service
    restart: unless-stopped
    environment:
      <<: *app-env
      EUREKA_INSTANCE_HOSTNAME: user-service
      MONGO_DB: users
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/demo/protocol/openid-connect/token
      KEYCLOAK_ADMIN_URI: http://keycloak:8080/admin/realms/demo
    ports:
      - "8082:8082"
    depends_on:
      - eureka-server
      - config-server
      - mongo-rs-init
      - kafka
      - keycloak

  product-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: product-service
    container_name: demo-product-service
    restart: unless-stopped
    environment:
      <<: *app-env
      EUREKA_INSTANCE_HOSTNAME: product-service
      MONGO_DB: products
    ports:
      - "8083:8083"
    depends_on:
      - eureka-server
      - config-server
      - mongo-rs-init
      - kafka
      - keycloak
      - redis

  order-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: order-service
    container_name: demo-order-service
    restart: unless-stopped
    environment:
      <<: *app-env
      EUREKA_INSTANCE_HOSTNAME: order-service
      MONGO_DB: orders
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: demo
      # No DB_USERNAME/DB_PASSWORD/ORDER_SERVICE_CLIENT_SECRET here (task #75, real secrets
      # management) — order-service now pulls those from Vault at startup (spring.config.import:
      # optional:vault://, see its application.yaml) instead of a plaintext env var or a committed
      # k8s Secret. VAULT_TOKEN is dev-mode's own fixed root token — acceptable for a throwaway
      # local Vault holding nothing but this demo's own low-stakes credentials; a real deployment
      # would use Vault's Kubernetes auth method instead (pods authenticate via their own
      # ServiceAccount token, no static bootstrap secret needed at all).
      VAULT_HOST: vault
      VAULT_PORT: 8200
      VAULT_TOKEN: demo-root-token
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/demo/protocol/openid-connect/token
      INVENTORY_SERVICE_URI: http://inventory-service:8089
    ports:
      - "8084:8084"
    depends_on:
      - eureka-server
      - config-server
      - mysql
      - mongo-rs-init
      - kafka
      - keycloak
      - vault-init

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: payment-service
    container_name: demo-payment-service
    restart: unless-stopped
    environment:
      <<: *app-env
      EUREKA_INSTANCE_HOSTNAME: payment-service
      MONGO_DB: payments
      PAYMENT_PROOF_UPLOAD_DIR: /data/payment-proofs
    volumes:
      - payment_proofs:/data/payment-proofs
    ports:
      - "8086:8086"
    depends_on:
      - eureka-server
      - config-server
      - mongo-rs-init
      - kafka
      - keycloak

  shipping-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: shipping-service
    container_name: demo-shipping-service
    restart: unless-stopped
    environment:
      <<: *app-env
      EUREKA_INSTANCE_HOSTNAME: shipping-service
      MONGO_DB: shipments
    ports:
      - "8088:8088"
    depends_on:
      - eureka-server
      - config-server
      - mongo-rs-init
      - kafka
      - keycloak

  delivery-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: delivery-service
    container_name: demo-delivery-service
    restart: unless-stopped
    environment:
      <<: *app-env
      EUREKA_INSTANCE_HOSTNAME: delivery-service
      MONGO_DB: deliveries
    ports:
      - "8087:8087"
    depends_on:
      - eureka-server
      - config-server
      - mongo-rs-init
      - kafka
      - keycloak

  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: inventory-service
    container_name: demo-inventory-service
    restart: unless-stopped
    environment:
      <<: *app-env
      EUREKA_INSTANCE_HOSTNAME: inventory-service
      MONGO_DB: inventory
    ports:
      - "8089:8089"
    depends_on:
      - eureka-server
      - config-server
      - mongo-rs-init
      - kafka
      - keycloak
      - redis

  reporting-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: reporting-service
    container_name: demo-reporting-service
    restart: unless-stopped
    environment:
      <<: *app-env
      EUREKA_INSTANCE_HOSTNAME: reporting-service
      MONGO_DB: reporting
    ports:
      - "8095:8095"
    depends_on:
      - eureka-server
      - config-server
      - mongo-rs-init
      - kafka
      - keycloak
      - redis

  common-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: common-service
    container_name: demo-common-service
    restart: unless-stopped
    environment:
      <<: *app-env
      EUREKA_INSTANCE_HOSTNAME: common-service
      MONGO_DB: reference
    ports:
      - "8096:8096"
    depends_on:
      - eureka-server
      - config-server
      - mongo-rs-init
      - kafka
      - keycloak

  product-comment-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: product-comment-service
    container_name: demo-product-comment-service
    restart: unless-stopped
    environment:
      <<: *app-env
      EUREKA_INSTANCE_HOSTNAME: product-comment-service
      MONGO_DB: comments
    ports:
      - "8091:8091"
    depends_on:
      - eureka-server
      - config-server
      - mongo-rs-init
      - kafka
      - keycloak

  product-media-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: product-media-service
    container_name: demo-product-media-service
    restart: unless-stopped
    environment:
      <<: *app-env
      EUREKA_INSTANCE_HOSTNAME: product-media-service
      MONGO_DB: media
      MEDIA_UPLOAD_DIR: /data/media-uploads
    volumes:
      - media_uploads:/data/media-uploads
    ports:
      - "8092:8092"
    depends_on:
      - eureka-server
      - config-server
      - mongo-rs-init
      - kafka
      - keycloak

  product-review-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: product-review-service
    container_name: demo-product-review-service
    restart: unless-stopped
    environment:
      <<: *app-env
      EUREKA_INSTANCE_HOSTNAME: product-review-service
      MONGO_DB: reviews
    ports:
      - "8093:8093"
    depends_on:
      - eureka-server
      - config-server
      - mongo-rs-init
      - kafka
      - keycloak

  chat-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: chat-service
    container_name: demo-chat-service
    restart: unless-stopped
    environment:
      <<: *app-env
      EUREKA_INSTANCE_HOSTNAME: chat-service
      MONGO_DB: chat
    ports:
      - "8094:8094"
    depends_on:
      - eureka-server
      - config-server
      - mongo-rs-init
      - kafka
      - keycloak

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: notification-service
    container_name: demo-notification-service
    restart: unless-stopped
    environment:
      <<: *app-env
      EUREKA_INSTANCE_HOSTNAME: notification-service
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    ports:
      - "8085:8085"
    depends_on:
      - eureka-server
      - config-server
      - kafka
      - mailpit
      - keycloak

  frontend:
    build:
      context: ./frontend
    container_name: demo-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - gateway-service

