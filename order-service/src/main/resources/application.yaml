server:
  port: 8084
  tomcat:
    threads:
      # Spring Boot's own default (max 200, min-spare 10) sizes for a generic app with no idea
      # what's downstream. This one has a specific bottleneck worth sizing against: every request
      # either holds a JDBC connection (HikariCP's own default pool, unconfigured here, is 10) or
      # blocks on the outbound WebClient call to inventory-service. Past ~4x the DB pool size,
      # extra request threads just pile up waiting for a connection that isn't there — more
      # context-switching, not more throughput. 40 leaves headroom for the inventory-service calls
      # (which don't hold a DB connection while blocked) without going anywhere near 200.
      max: ${SERVER_TOMCAT_THREADS_MAX:40}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:10}
    # Requests beyond max-threads queue here instead of being refused outright — bounded so a
    # sustained overload fails fast (503) rather than growing an unbounded queue of requests that'll
    # time out anyway by the time they're served.
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:50}

spring:
  application:
    name: order-service
  config:
    # optional:vault:// — DB_USERNAME/DB_PASSWORD/ORDER_SERVICE_CLIENT_SECRET below are looked up
    # from Vault's secret/order-service path (task #75, real secrets management) if Vault is
    # reachable; "optional" means local dev without Vault running still starts fine, falling back
    # to the placeholder defaults right below, same resilience pattern already used for config-server.
    import: "optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888},optional:vault://"

  cloud:
    vault:
      host: ${VAULT_HOST:localhost}
      port: ${VAULT_PORT:8200}
      scheme: http
      authentication: TOKEN
      token: ${VAULT_TOKEN:demo-root-token}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:demo}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:demo}
    password: ${DB_PASSWORD:demo}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: order-service-hikari
      # Sized per pod, not per service — k8s-horizontal-scaling can run several order-service pods
      # at once, each opening its own pool against the same MySQL instance, so this has to leave
      # headroom under MySQL's max_connections rather than assume it's the only consumer.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:15}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1200000}
      # Logs a stack trace for any connection held > 30s instead of silently starving the pool —
      # HikariCP ships this off by default.
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:30000}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  mongodb:
    uri: mongodb://${MONGO_HOST:localhost:27017}/${MONGO_DB:orders}${MONGO_REPLICA_SET_PARAM:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      # earliest, not the client default of "latest": OrderSagaListener's consumer group is only
      # ever a few hundred ms old on a fresh deploy (new group id, or first-ever startup) — with
      # "latest" any payment/shipping/delivery event published before that group's initial
      # partition assignment finishes is silently skipped forever rather than replayed, which is
      # never acceptable for a saga step. Once the group has committed offsets this is a no-op.
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  security:
    oauth2:
      client:
        registration:
          inventory-service:
            client-id: order-service-client
            client-secret: ${ORDER_SERVICE_CLIENT_SECRET:order-service-secret}
            authorization-grant-type: client_credentials
        provider:
          inventory-service:
            # token-uri directly (skips OIDC discovery) — needs the internally-resolvable Keycloak
            # address, same internal/external split as keycloak.jwk-set-uri below.
            token-uri: ${KEYCLOAK_TOKEN_URI:http://keycloak.localhost:8181/realms/demo/protocol/openid-connect/token}

services:
  inventory-service:
    uri: ${INVENTORY_SERVICE_URI:http://localhost:8089}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: false
    metadata-map:
      # Public path prefix this service owns at the gateway edge — gateway-service builds its route
      # table from this metadata (see user-service's application.yaml for the full note).
      "gateway.paths": /api/orders/**

keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak.localhost:8181/realms/demo}
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak.localhost:8181/realms/demo/protocol/openid-connect/certs}

management:
  endpoint:
    health:
      probes:
        enabled: true

# CircuitBreaker + TimeLimiter for this same call are already configured programmatically in
# Resilience4jConfig — these three layer on top of that (see InventoryServiceClient's javadoc).
resilience4j:
  retry:
    instances:
      inventoryService:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  ratelimiter:
    instances:
      inventoryService:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 0s
  bulkhead:
    instances:
      inventoryService:
        max-concurrent-calls: 5
