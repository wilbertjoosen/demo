server:
  port: 8094

spring:
  application:
    name: chat-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}

  mongodb:
    uri: mongodb://${MONGO_HOST:localhost:27017}/${MONGO_DB:chat}${MONGO_REPLICA_SET_PARAM:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: false
    metadata-map:
      # Public path prefix(es) this service owns at the gateway edge — comma-separated, since chat-service
      # serves two. gateway-service builds its route table from this metadata (see user-service's
      # application.yaml for the full note). The /ws/chat/** WebSocket is not routed (webmvc gateway has
      # no WS proxy) — the SPA connects to it directly.
      "gateway.paths": /api/chat/**,/api/conversations/**

keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak.localhost:8081/realms/demo}
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak.localhost:8081/realms/demo/protocol/openid-connect/certs}

management:
  endpoint:
    health:
      probes:
        enabled: true
