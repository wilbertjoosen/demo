name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Explicit rather than relying on repo-level defaults — GITHUB_TOKEN needs package-write to push
# images to GHCR, and contents-write for the deploy job's auto-commit back to k8s/.
permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  backend-test:
    name: Backend (Maven reactor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      # `verify` (not just `test`) so Checkstyle + SpotBugs run too — both are bound to the verify
      # phase in the root pom, alongside the Testcontainers-backed integration tests (order-service,
      # chat-service), which need real Docker; GitHub-hosted ubuntu-latest runners have it preinstalled.
      - name: Run tests + static analysis
        run: ./mvnw -B verify

  frontend-test:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # npm run build already chains `vue-tsc -b && vite build` — one command covers both gates.
      - run: npm run build

  changes:
    name: Detect changed services
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.matrix.outputs.services }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          # dorny/paths-filter diffs against the previous commit on the branch — needs real
          # history, not the default shallow (fetch-depth: 1) checkout.
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'pom.xml'
              - 'mvnw'
              - 'mvnw.cmd'
              - '.mvn/**'
              - 'Dockerfile.service'
              - 'common-security/**'
              - 'common-audit/**'
              - 'common-model/**'
            frontend:
              - 'frontend/**'
            eureka-server: [ 'eureka-server/**' ]
            config-server: [ 'config-server/**' ]
            gateway-service: [ 'gateway-service/**' ]
            inventory-service: [ 'inventory-service/**' ]
            audit-service: [ 'audit-service/**' ]
            user-service: [ 'user-service/**' ]
            product-service: [ 'product-service/**' ]
            order-service: [ 'order-service/**' ]
            payment-service: [ 'payment-service/**' ]
            shipping-service: [ 'shipping-service/**' ]
            delivery-service: [ 'delivery-service/**' ]
            notification-service: [ 'notification-service/**' ]
            product-comment-service: [ 'product-comment-service/**' ]
            product-media-service: [ 'product-media-service/**' ]
            product-review-service: [ 'product-review-service/**' ]
            chat-service: [ 'chat-service/**' ]
      - name: Build service matrix
        id: matrix
        # A shared module (or the root pom/Dockerfile) changing can affect every service, since
        # each image build runs `mvnw -pl <service> -am` — so it forces a full rebuild. Otherwise,
        # only the services whose own directory changed go into the matrix.
        run: |
          if [ "${{ steps.filter.outputs.shared }}" = "true" ]; then
            SERVICES='["eureka-server","config-server","gateway-service","inventory-service","audit-service","user-service","product-service","order-service","payment-service","shipping-service","delivery-service","notification-service","product-comment-service","product-media-service","product-review-service","chat-service"]'
          else
            SERVICES=$(echo '${{ steps.filter.outputs.changes }}' | jq -c '[.[] | select(. != "frontend")]')
          fi
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

  # Everything below here only runs on a genuine push to main (not PRs) — no point building/pushing
  # images for a change that isn't merged yet.
  build-and-push:
    name: Build & push images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.services != '[]'
    needs: [backend-test, frontend-test, changes]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - name: Read service version
        id: version
        # Each service's own <version> (not the parent reactor's) — the top-level /project/version,
        # not the one inside <parent>. xmllint (preinstalled) beats a grep here since the parent
        # block has its own <version> line earlier in the same file.
        run: |
          VERSION=$(xmllint --xpath 'string(/*[local-name()="project"]/*[local-name()="version"])' ${{ matrix.service }}/pom.xml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.service
          build-args: SERVICE=${{ matrix.service }}
          # This cluster's nodes are arm64 (local k3d on Apple Silicon) — not multi-arch, since
          # nothing here targets amd64 today, and it'd need QEMU emulation for no payoff.
          platforms: linux/arm64
          push: true
          # SHA tag is what k8s manifests actually deploy by (immutable, guarantees every push
          # rolls out even if the version wasn't bumped); the semver tag rides along on the same
          # image purely for human-readable release tracking.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/demo-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/demo-${{ matrix.service }}:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  build-and-push-frontend:
    name: Build & push frontend image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.frontend == 'true'
    needs: [backend-test, frontend-test, changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read frontend version
        id: version
        run: echo "version=$(jq -r .version frontend/package.json)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          # MODE=k8s (frontend/.env.k8s, not .env.production/its own default) — docker-compose.yml's
          # own frontend service always builds straight from source locally, never pulls this image,
          # so this published image has exactly one consumer: k8s/frontend.yaml. It needs the
          # ingress-routed URLs (relative API base, ws://.../ws/* through Traefik), not the
          # localhost:* ones .env.production bakes in for the docker-compose/host-JVM dev flow,
          # where the browser reaches every backend service on its own published host port instead.
          build-args: MODE=k8s
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/demo-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/demo-frontend:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  update-manifests:
    name: Update k8s manifests -> ArgoCD sync
    # Runs if either build job actually built something (not just "didn't fail" — a *skipped* job
    # also isn't 'failure', so this has to check for 'success' explicitly on at least one of them).
    if: |
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.build-and-push.result == 'success' || needs.build-and-push-frontend.result == 'success')
    needs: [changes, build-and-push, build-and-push-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A later `git push` needs a real ref, not the detached HEAD checkout actions/checkout leaves by default.
          ref: main
      - name: Point manifests at this commit's images
        run: |
          # Only touch manifests for services that were actually rebuilt this run — touching every
          # k8s/*.yaml unconditionally would bump untouched services to a SHA tag that was never
          # pushed to GHCR, breaking their next ArgoCD sync.
          FILES=$(echo '${{ needs.changes.outputs.services }}' | jq -r '.[] | "k8s/" + . + ".yaml"')
          if [ "${{ needs.changes.outputs.frontend }}" = "true" ]; then
            FILES="$FILES
          k8s/frontend.yaml"
          fi
          # Handles both the steady state (already ghcr.io/.../demo-<service>:<old-sha>, bump the tag)
          # and the one-time first run (still demo/<service>:<local tag> from before CI/CD existed,
          # or from manual local iteration — e.g. demo/frontend:1.0.0 built straight from
          # package.json's version, demo/order-service:1.0.3 from pom.xml's) — either way, by the
          # time this step runs the SHA-tagged image already exists in GHCR (build-and-push ran
          # first), so ArgoCD never syncs a manifest pointing at an image that isn't pullable yet.
          # The local-tag pattern matches ANY tag under the demo/ prefix, not just a literal
          # ":local" — the point is "this manifest still points at a locally-built image, not
          # ghcr.io yet", regardless of what that local tag's value actually is.
          echo "$FILES" | while IFS= read -r f; do
            [ -f "$f" ] || continue
            sed -i -E "s#image: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/demo-([a-z-]+):[a-zA-Z0-9._-]+#image: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/demo-\1:${{ github.sha }}#g" "$f"
            sed -i -E "s#image: demo/([a-z-]+):[a-zA-Z0-9._-]+#image: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/demo-\1:${{ github.sha }}#g" "$f"
          done
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No manifest changes (first run, or images already referenced by SHA some other way) — nothing to commit."
            exit 0
          fi
          git add k8s/*.yaml
          git commit -m "Deploy ${{ github.sha }} [skip ci]"
          git push
