name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Explicit rather than relying on repo-level defaults — GITHUB_TOKEN needs package-write to push
# images to GHCR, and contents-write for the deploy job's auto-commit back to k8s/.
permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  backend-test:
    name: Backend (Maven reactor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      # Full reactor test run — includes the Testcontainers-backed integration tests (order-service,
      # chat-service), which need real Docker; GitHub-hosted ubuntu-latest runners have it preinstalled.
      - name: Run tests
        run: ./mvnw -B test

  frontend-test:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # npm run build already chains `vue-tsc -b && vite build` — one command covers both gates.
      - run: npm run build

  # Everything below here only runs on a genuine push to main (not PRs) — no point building/pushing
  # images for a change that isn't merged yet.
  build-and-push:
    name: Build & push images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - eureka-server
          - config-server
          - gateway-service
          - inventory-service
          - audit-service
          - user-service
          - product-service
          - order-service
          - payment-service
          - shipping-service
          - delivery-service
          - notification-service
          - product-comment-service
          - product-media-service
          - product-review-service
          - chat-service
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.service
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/demo-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/demo-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  build-and-push-frontend:
    name: Build & push frontend image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/demo-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/demo-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  update-manifests:
    name: Update k8s manifests -> ArgoCD sync
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-push, build-and-push-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A later `git push` needs a real ref, not the detached HEAD checkout actions/checkout leaves by default.
          ref: main
      - name: Point manifests at this commit's images
        run: |
          # Handles both the steady state (already ghcr.io/.../demo-<service>:<old-sha>, bump the tag)
          # and the one-time first run (still demo/<service>:local from before CI/CD existed) — either
          # way, by the time this step runs the SHA-tagged image already exists in GHCR (build-and-push
          # ran first), so ArgoCD never syncs a manifest pointing at an image that isn't pullable yet.
          for f in k8s/*.yaml; do
            sed -i -E "s#image: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/demo-([a-z-]+):[a-zA-Z0-9._-]+#image: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/demo-\1:${{ github.sha }}#g" "$f"
            sed -i -E "s#image: demo/([a-z-]+):local#image: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/demo-\1:${{ github.sha }}#g" "$f"
          done
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No manifest changes (first run, or images already referenced by SHA some other way) — nothing to commit."
            exit 0
          fi
          git add k8s/*.yaml
          git commit -m "Deploy ${{ github.sha }} [skip ci]"
          git push
