# QA counterpart to application.yaml — same repo, but tracks the testing branch (whose k8s
# manifests target namespace demo-qa and the isolated QA infra from docker-compose.qa.yml) instead
# of main. Not applied by the demo-qa namespace's own kubectl apply — this is ArgoCD's own
# Application CR, applied once into the argocd namespace to tell it what to sync and from where.
#
# PENDING (k8s/RESTRUCTURE.md step 5): once the testing branch adopts the folder split, this
# becomes `path: k8s/demo-qa` with `directory: { recurse: true }` — the QA app tier only. Shared
# infra + monitoring stay owned by application.yaml's `demo` Application (k8s/platform/**), which
# this Application must not re-sync. Left as `path: k8s` for now so it keeps working against
# testing's still-flat layout until that migration lands.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-qa
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/wilbertjoosen/demo.git
    targetRevision: testing
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-qa
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
