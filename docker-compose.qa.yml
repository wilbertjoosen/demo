# QA/testing environment infra. The heavy stateful stores (MySQL, MongoDB, Elasticsearch) AND
# Keycloak are all SHARED with docker-compose.yml's production instances — QA gets its own
# database/index names and its own Keycloak realm ("demo-qa", see docker/keycloak/realm-demo-qa.json,
# imported by the SAME prod Keycloak container) instead of its own containers, to avoid running two
# of everything on one machine. What actually needs real isolation stays separate here: Kafka
# (shared topics would mean QA test traffic triggering prod's saga and vice versa), Redis, Mailpit.
# The actual build/deploy path (k8s namespace, ArgoCD Application) is fully separate regardless —
# see the testing branch's own k8s/*.yaml.
#
# One-time setup on the shared MySQL (run once, not part of any automated flow):
#   docker exec demo-mysql mysql -uroot -proot -e \
#     "CREATE DATABASE IF NOT EXISTS demo_qa; GRANT ALL PRIVILEGES ON demo_qa.* TO 'demo'@'%'; FLUSH PRIVILEGES;"
# MongoDB and Elasticsearch need no such step — Mongo creates a database on first write, and
# Elasticsearch auto-creates an index on first write (action.auto_create_index defaults to true).
# Keycloak picks up the new realm file on its next restart (--import-realm scans the whole mounted
# directory) — restart the prod keycloak container once after adding the realm file.
#
# Usage: docker compose -f docker-compose.qa.yml -p demo-qa up -d
services:
  kafka-qa:
    image: apache/kafka:3.8.0
    container_name: demo-qa-kafka
    restart: unless-stopped
    ports:
      - "9192:9092"
      - "9194:9194"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Same two-listener split as the prod stack (see docker-compose.yml's comment) — PLAINTEXT for
      # host-JVM debugging against QA infra, PLAINTEXT_K8S dedicated to pods in the demo-qa namespace.
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,PLAINTEXT_K8S://:9194,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9192,PLAINTEXT_INTERNAL://kafka-qa:29092,PLAINTEXT_K8S://host.k3d.internal:9194
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_K8S:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  redis-qa:
    image: redis:7-alpine
    container_name: demo-qa-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_qa_data:/data

  mailpit-qa:
    image: axllent/mailpit:latest
    container_name: demo-qa-mailpit
    restart: unless-stopped
    ports:
      - "1026:1025" # SMTP
      - "8026:8025" # Web UI

volumes:
  redis_qa_data:
