# QA/testing environment infra — for HOST-JVM debugging only (kcat, redis-cli, a local IDE run
# against QA). The demo-qa k8s namespace itself no longer depends on kafka-qa/redis-qa: it runs
# its own in-cluster Kafka and Redis instead (k8s/kafka.yaml, k8s/redis.yaml), the same way
# docker-compose.yml's redis/kafka are dev-only now too — see that file's redis comment. kafka-qa
# therefore only carries the plain host listeners below (no PLAINTEXT_K8S split anymore, since
# nothing in the cluster reaches this container).
#
# The heavy stateful stores (MySQL, MongoDB, Elasticsearch) AND Keycloak are all SHARED with
# docker-compose.yml's production instances — QA gets its own database/index names and its own
# Keycloak realm ("demo-qa", see docker/keycloak/realm-demo-qa.json, imported by the SAME prod
# Keycloak container) instead of its own containers, to avoid running two of everything on one
# machine. Kafka/Redis/Mailpit stay genuinely isolated (their own QA-only containers): Kafka
# specifically because shared topics would mean QA test traffic triggering prod's saga and vice
# versa. The actual build/deploy path (k8s namespace, ArgoCD Application) is fully separate
# regardless — see the testing branch's own k8s/*.yaml.
#
# One-time setup on the shared MySQL (run once, not part of any automated flow):
#   docker exec demo-mysql mysql -uroot -proot -e \
#     "CREATE DATABASE IF NOT EXISTS demo_qa; GRANT ALL PRIVILEGES ON demo_qa.* TO 'demo'@'%'; FLUSH PRIVILEGES;"
# MongoDB and Elasticsearch need no such step — Mongo creates a database on first write, and
# Elasticsearch auto-creates an index on first write (action.auto_create_index defaults to true).
# Keycloak picks up the new realm file on its next restart (--import-realm scans the whole mounted
# directory) — restart the prod keycloak container once after adding the realm file.
#
# Usage: docker compose -f docker-compose.qa.yml -p demo-qa up -d
services:
  kafka-qa:
    image: apache/kafka:3.8.0
    container_name: demo-qa-kafka
    restart: unless-stopped
    ports:
      - "9192:9092"
      - "9194:9194"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners only, now that k8s pods use their own in-cluster kafka.demo-qa Service
      # instead of this container — PLAINTEXT_INTERNAL is what lets host-JVM clients on
      # localhost:9192 and containers on the demo-qa-network talk to the same broker consistently.
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9192,PLAINTEXT_INTERNAL://kafka-qa:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  redis-qa:
    image: redis:7-alpine
    container_name: demo-qa-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_qa_data:/data

  mailpit-qa:
    image: axllent/mailpit:latest
    container_name: demo-qa-mailpit
    restart: unless-stopped
    ports:
      - "1026:1025" # SMTP
      - "8026:8025" # Web UI

volumes:
  redis_qa_data:
