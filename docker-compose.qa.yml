# Fully isolated infra for the QA/testing environment — separate containers, separate volumes,
# separate host ports from docker-compose.yml's production stack, so the two can run side by side
# without ever sharing data. Scoped to what app pods actually connect to at runtime (mirrors
# k8s/configmap-common.yaml's variable set) — observability tooling (Grafana/Prometheus/Loki/Kibana)
# stays out of QA; it's dashboards for humans, not something a service depends on to function.
#
# Usage: docker compose -f docker-compose.qa.yml -p demo-qa up -d
services:
  mysql-qa:
    image: mysql:8.4
    container_name: demo-qa-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_qa_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb-qa:
    image: mongo:7
    container_name: demo-qa-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: demo
    ports:
      - "27018:27017"
    volumes:
      - mongo_qa_data:/data/db

  kafka-qa:
    image: apache/kafka:3.8.0
    container_name: demo-qa-kafka
    restart: unless-stopped
    ports:
      - "9192:9092"
      - "9194:9194"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Same two-listener split as the prod stack (see docker-compose.yml's comment) — PLAINTEXT for
      # host-JVM debugging against QA infra, PLAINTEXT_K8S dedicated to pods in the demo-qa namespace.
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,PLAINTEXT_K8S://:9194,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9192,PLAINTEXT_INTERNAL://kafka-qa:29092,PLAINTEXT_K8S://host.k3d.internal:9194
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_K8S:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  keycloak-qa:
    image: quay.io/keycloak/keycloak:latest
    container_name: demo-qa-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Same rationale as prod's KC_HOSTNAME (see docker-compose.yml) — fixed so every service's
      # KEYCLOAK_ISSUER_URI validator agrees on the token issuer regardless of which network reached it.
      KC_HOSTNAME: http://localhost:8082
    ports:
      - "8082:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import

  redis-qa:
    image: redis:7-alpine
    container_name: demo-qa-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_qa_data:/data

  elasticsearch-qa:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
    container_name: demo-qa-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9201:9200"
    volumes:
      - elasticsearch_qa_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit-qa:
    image: axllent/mailpit:latest
    container_name: demo-qa-mailpit
    restart: unless-stopped
    ports:
      - "1026:1025" # SMTP
      - "8026:8025" # Web UI

volumes:
  mysql_qa_data:
  mongo_qa_data:
  redis_qa_data:
  elasticsearch_qa_data:
