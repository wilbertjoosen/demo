# Minimal single-binary, local-storage Tempo config — matches this project's demo scale (no
# object storage backend, no distributed compactor/ingester split).
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
        grpc:

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    block_retention: 24h
