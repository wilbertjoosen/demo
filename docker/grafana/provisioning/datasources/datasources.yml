apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  # Host-JVM/docker-compose dev flow only. k8s/promtail-daemonset.yaml used to push here too
  # before it moved to its own in-cluster Loki (k8s/loki.yaml) — see the Loki (k8s) datasource below.
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100

  # The in-cluster Loki (k8s/loki.yaml, namespace "monitoring"), reached through the k3d ingress.
  - name: Loki (k8s)
    type: loki
    access: proxy
    url: http://loki.demo.localhost:18090
