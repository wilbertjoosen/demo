
# Targets use host.docker.internal (Docker Desktop's host-reachable DNS name) rather than
# container service names — that way the SAME config scrapes correctly whether the app services
# are running as host JVMs (the `mvn spring-boot:run` dev flow used throughout this project, ports
# published on the host already) or as the containerized docker-compose services (which publish
# those same ports to the host too). Either way, Prometheus finds them.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: eureka-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8761"]

  - job_name: config-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8888"]

  - job_name: gateway-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: audit-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8090"]

  - job_name: user-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8082"]

  - job_name: product-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8083"]

  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8084"]

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8085"]

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8086"]

  - job_name: delivery-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8087"]

  - job_name: shipping-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8088"]

  - job_name: inventory-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8089"]

  - job_name: product-comment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8091"]

  - job_name: product-media-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8092"]

  - job_name: product-review-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8093"]

  - job_name: chat-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8094"]

  - job_name: reporting-service
    metrics_path: /actuator/prometheus
    static_configs:
      # 8097, not 8095: this branch's reporting-service/application.yaml deliberately keeps its own
      # bundled default off both 8095 (kafka-ui's host port) and 8096 (common-service's own bundled
      # default) — k8s/reporting-service.yaml overrides to 8095 in-cluster only. See that file's
      # comment for the full reasoning.
      - targets: [ "host.docker.internal:8097" ]

# k8s-deployed services (both demo and demo-qa namespaces) are scraped by a SEPARATE Prometheus
# running inside the cluster instead — see k8s/prometheus.yaml. Pod IPs on the k3d overlay network
# aren't reachable from a container out here in docker-compose at all (tried it: discovery via the
# API server worked, but every scrape timed out), so this Prometheus can only ever cover the
# host-JVM/docker-compose dev flow above it, not what's actually running in the cluster.
