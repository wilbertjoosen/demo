# In-cluster Rancher, in the "cattle-system" namespace. Generated from the official Helm chart via
# `helm template` — NOT `helm install`, and NOT hand-rolled from scratch (an earlier version of this
# file was) — the committed artifact below is still static, plain YAML applied with a normal
# `kubectl apply`, exactly like every other manifest in this repo (Helm is used once, locally, as a
# generator; nothing in the cluster or CI ever runs `helm` against it).
#
# Why this replaced the hand-rolled version: running Rancher as a bare hand-written Deployment
# worked for the UI/secrets/workloads, but its self-registration as the "local" managed cluster
# (visible on the Rancher home page with live CPU/memory/pod stats) silently depended on more
# plumbing than expected — a `rancher-internal` Service, specific RBAC, a `rancher-config` ConfigMap
# — that only the chart knew to create. Reproducing those piece-by-piece by hand turned into
# whack-a-mole; rendering the real chart gets everything it provides in one shot while keeping the
# "no Helm at apply time" rule intact.
#
# Regenerate with:
#   helm repo add rancher-latest https://releases.rancher.com/server-charts/latest && helm repo update
#   helm template rancher rancher-latest/rancher --namespace cattle-system \
#     --set hostname=localhost --set bootstrapPassword=rancherdemo123 \
#     --set networkExposure.type=none --set ingress.enabled=false --set ingress.tls.source=secret \
#     --set replicas=1 --set image.tag=latest
# ...then re-apply the same patches this file already has on top of the raw output:
#   - stripped the 2 Helm lifecycle hook Jobs (rancher-pre-upgrade/rancher-post-delete) and their
#     dedicated ServiceAccounts/ClusterRoles/ClusterRoleBindings/ConfigMaps — real Helm-hook
#     semantics (`helm.sh/hook: pre-upgrade` etc.) don't mean anything to plain `kubectl apply`, so
#     applying them as ordinary resources would just run install/upgrade-lifecycle logic outside any
#     real upgrade, for no benefit.
#   - stripped the cert-manager `Issuer` (via `ingress.tls.source=secret` at render time) — this repo
#     deliberately has no cert-manager (see the original architecture plan's own reasoning for
#     picking the standalone Rancher container specifically to avoid that dependency); Rancher's
#     own container already self-generates its TLS cert directly, no Issuer needed for that.
#   - explicit `namespace: cattle-system` added to every namespaced resource — `helm template`
#     only stamps it onto a couple of resources by default; the rest rely on `--namespace` at apply
#     time, which this repo's `kubectl apply -f k8s-rancher/` never passes.
#   - added back the same hostPort/nodeSelector exposure (9080/9443, pinned to
#     k3d-demo-server-0) as before — same reasoning as k8s/keycloak.yaml, still no confirmed
#     equivalent to ArgoCD's --insecure flag for handing TLS off to Traefik instead. Requires the
#     k3d cluster to be created with matching -p "9080:9080@loadbalancer" -p
#     "9443:9443@loadbalancer" flags (see README.md's Kubernetes/GitOps section).
#   - added back the PVC-backed /var/lib/rancher mount and CPU/memory requests/limits — the chart's
#     own default Deployment has neither (no volumes, no resources block) in this version; kept both
#     to preserve state across pod restarts/preserve the already-bootstrapped data, and to keep the
#     "PVC-backed, sized" convention this repo already uses everywhere else (MySQL, Keycloak,
#     Prometheus, Grafana).
#   - Deployment strategy overridden to Recreate (chart defaults to RollingUpdate) — the PVC above is
#     ReadWriteOnce, so a rolling update trying to schedule a second pod before killing the first
#     would just hang trying to mount an already-attached volume.
#
# Rancher does auto-register the cluster it's running in as "local" this way (K8sMode:auto — unlike
# the old docker-compose container, which had zero Kubernetes context and needed a manual "Import
# Existing" click).
apiVersion: v1
kind: Namespace
metadata:
  name: cattle-system
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: rancher-critical
  labels:
    app: rancher
    chart: rancher-2.15.0
    heritage: Helm
    release: rancher
value: 1000000000
globalDefault: false
description: Priority class used by pods critical to rancher's functionality.
---
kind: ServiceAccount
apiVersion: v1
metadata:
  name: rancher
  labels:
    app: rancher
    chart: rancher-2.15.0
    heritage: Helm
    release: rancher
  namespace: cattle-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rancher-config
  labels:
    app: rancher
    chart: rancher-2.15.0
    heritage: Helm
    release: rancher
    app.kubernetes.io/part-of: rancher
  namespace: cattle-system
data:
  priorityClassName: rancher-critical
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: rancher
  labels:
    app: rancher
    chart: rancher-2.15.0
    heritage: Helm
    release: rancher
subjects:
- kind: ServiceAccount
  name: rancher
  namespace: cattle-system
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: rancher
  labels:
    app: rancher
    chart: rancher-2.15.0
    heritage: Helm
    release: rancher
  namespace: cattle-system
spec:
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  - port: 443
    targetPort: 443
    protocol: TCP
    name: https
  selector:
    app: rancher
---
apiVersion: v1
kind: Service
metadata:
  name: rancher-internal
  labels:
    app: rancher
    chart: rancher-2.15.0
    heritage: Helm
    release: rancher
  namespace: cattle-system
spec:
  type: ClusterIP
  ports:
  - port: 443
    targetPort: 444
    protocol: TCP
    name: https-internal
  selector:
    app: rancher
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: rancher
  labels:
    app: rancher
    chart: rancher-2.15.0
    heritage: Helm
    release: rancher
  namespace: cattle-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rancher
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: rancher
        release: rancher
    spec:
      priorityClassName: rancher-critical
      serviceAccountName: rancher
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - rancher
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/os
                operator: NotIn
                values:
                - windows
      tolerations:
      - key: cattle.io/os
        value: linux
        effect: NoSchedule
        operator: Equal
      containers:
      - image: rancher/rancher:latest
        imagePullPolicy: IfNotPresent
        name: rancher
        ports:
        - containerPort: 80
          protocol: TCP
          hostPort: 9080
        - containerPort: 443
          protocol: TCP
          hostPort: 9443
        - containerPort: 444
          protocol: TCP
        - containerPort: 6666
          protocol: TCP
        args:
        - --no-cacerts
        - --http-listen-port=80
        - --https-listen-port=443
        - --add-local=true
        env:
        - name: CATTLE_NAMESPACE
          value: cattle-system
        - name: CATTLE_PEER_SERVICE
          value: rancher
        - name: CATTLE_BOOTSTRAP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bootstrap-secret
              key: bootstrapPassword
        - name: IMPERATIVE_API_DIRECT
          value: 'true'
        - name: IMPERATIVE_API_APP_SELECTOR
          value: rancher
        startupProbe:
          httpGet:
            path: /healthz
            port: 80
          timeoutSeconds: 5
          failureThreshold: 12
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          timeoutSeconds: 5
          periodSeconds: 30
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          timeoutSeconds: 5
          periodSeconds: 30
          failureThreshold: 5
        volumeMounts:
        - name: data
          mountPath: /var/lib/rancher
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: '2'
            memory: 2Gi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: rancher-data
      nodeSelector:
        kubernetes.io/hostname: k3d-demo-server-0
---
apiVersion: v1
kind: Secret
metadata:
  name: bootstrap-secret
  namespace: cattle-system
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: '-5'
    helm.sh/resource-policy: keep
type: Opaque
data:
  bootstrapPassword: cmFuY2hlcmRlbW8xMjM=
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rancher-data
  namespace: cattle-system
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
