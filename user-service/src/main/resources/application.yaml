server:
  port: 8082

spring:
  application:
    name: user-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}

  mongodb:
    uri: mongodb://${MONGO_HOST:localhost:27017}/${MONGO_DB:users}${MONGO_REPLICA_SET_PARAM:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  security:
    oauth2:
      client:
        registration:
          keycloak-admin:
            client-id: user-service-admin-client
            client-secret: ${USER_SERVICE_ADMIN_CLIENT_SECRET:user-service-admin-secret}
            authorization-grant-type: client_credentials
        provider:
          keycloak-admin:
            # token-uri directly (skips OIDC discovery) — needs the internally-resolvable Keycloak
            # address, same internal/external split as keycloak.jwk-set-uri below.
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8081/realms/demo/protocol/openid-connect/token}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: false

keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/demo}
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/demo/protocol/openid-connect/certs}
  admin-uri: ${KEYCLOAK_ADMIN_URI:http://localhost:8081/admin/realms/demo}

management:
  endpoint:
    health:
      probes:
        enabled: true
