server:
  port: 8089

spring:
  application:
    name: inventory-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}

  mongodb:
    uri: mongodb://${MONGO_HOST:localhost:27017}/${MONGO_DB:inventory}${MONGO_REPLICA_SET_PARAM:}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 30s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    streams:
      application-id: inventory-service
      # Same reasoning as reporting-service: a fresh instance's alertedStore (RocksDB) starts
      # empty, and every STOCK_LEVEL_CHANGED event carries the full current quantity (not a
      # delta), so replaying from earliest reconstructs the exact same edge-trigger history as if
      # this instance had been running the whole time — Streams' default (latest) would silently
      # miss any line that dipped below threshold before this instance started.
      properties:
        auto.offset.reset: earliest
        state.dir: ${KAFKA_STREAMS_STATE_DIR:/tmp/kafka-streams/inventory-service}

inventory:
  reorder:
    # Per-(productId, warehouseId) line: below this quantity, LOW_STOCK_DETECTED fires once (until restocked above it again).
    threshold: ${INVENTORY_REORDER_THRESHOLD:10}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: false

keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak.localhost:8081/realms/demo}
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak.localhost:8081/realms/demo/protocol/openid-connect/certs}

management:
  endpoint:
    health:
      probes:
        enabled: true
