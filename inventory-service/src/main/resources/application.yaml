server:
  port: 8089

spring:
  application:
    name: inventory-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}

  mongodb:
    uri: mongodb://${MONGO_HOST:localhost:27017}/${MONGO_DB:inventory}${MONGO_REPLICA_SET_PARAM:}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 30s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

inventory:
  reorder:
    # Per-(productId, warehouseId) line: below this quantity, LOW_STOCK_DETECTED fires once (until restocked above it again).
    threshold: ${INVENTORY_REORDER_THRESHOLD:10}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: false
    metadata-map:
      # Public path prefix this service owns at the gateway edge — gateway-service builds its route
      # table from this metadata (see user-service's application.yaml for the full note).
      "gateway.paths": /api/inventory/**

keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak.localhost:8081/realms/demo}
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak.localhost:8081/realms/demo/protocol/openid-connect/certs}

management:
  endpoint:
    health:
      probes:
        enabled: true
