server:
  port: 8096

spring:
  application:
    name: reporting-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    streams:
      application-id: reporting-service
      # Fresh instance (no local RocksDB state, no changelog topic yet) must replay every event
      # ever published to rebuild the read model from scratch — Streams' default (latest) would
      # silently start the KTables empty and only see events published from this point on.
      properties:
        auto.offset.reset: earliest
        state.dir: ${KAFKA_STREAMS_STATE_DIR:/tmp/kafka-streams/reporting-service}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: false

keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8181/realms/demo}
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8181/realms/demo/protocol/openid-connect/certs}

management:
  endpoint:
    health:
      probes:
        enabled: true
