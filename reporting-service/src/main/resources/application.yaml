server:
  # Local-dev default is 8097: 8095 collides with kafka-ui's host port in this branch's
  # docker-compose.yml, 8096 with common-service's bundled default. In-cluster, k8s sets
  # SERVER_PORT=8095 (k8s/demo/reporting-service.yaml) so it matches that manifest's
  # containerPort/probes/Services and the frozen prod image (1.0.2-966aac3, built when this
  # was hard-coded 8095). Keep the env override and the manifest port in lock-step.
  port: ${SERVER_PORT:8097}

spring:
  application:
    name: reporting-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    streams:
      application-id: reporting-service
      # Fresh instance (no local RocksDB state, no changelog topic yet) must replay every event
      # ever published to rebuild the read model from scratch — Streams' default (latest) would
      # silently start the KTables empty and only see events published from this point on.
      properties:
        auto.offset.reset: earliest
        state.dir: ${KAFKA_STREAMS_STATE_DIR:/tmp/kafka-streams/reporting-service}
        # Matches kafka.topics.partitions (common-security's KafkaTopicAutoConfiguration, default
        # 3) — Streams assigns at most one thread per partition per input topic, so this only helps
        # up to however many partitions the topics with the most partitions actually have.
        num.stream.threads: ${KAFKA_STREAMS_THREADS:3}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: false

keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak.localhost:8181/realms/demo}
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak.localhost:8181/realms/demo/protocol/openid-connect/certs}

management:
  endpoint:
    health:
      probes:
        enabled: true
