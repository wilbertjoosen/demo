server:
  port: 8080

spring:
  application:
    name: gateway-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/products/**
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**
            - id: shipping-service
              uri: lb://shipping-service
              predicates:
                - Path=/api/shipments/**
            - id: delivery-service
              uri: lb://delivery-service
              predicates:
                - Path=/api/deliveries/**
            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/api/inventory/**
            - id: audit-service
              uri: lb://audit-service
              predicates:
                - Path=/api/audit/**
    # Failover: if a route resolves to a service with 2+ instances registered in Eureka and one is
    # down/erroring, the LoadBalancer retries against a *different* instance automatically (enabled
    # by default; retry-on-all-operations is off by default since retrying a POST/PUT across
    # instances is only safe for idempotent calls — set true here for demo completeness across all
    # our routes, but a real system should judge this per-route rather than globally).
    loadbalancer:
      retry:
        enabled: true
        retry-on-all-operations: true
        max-retries-on-next-service-instance: 1

# Note: no route for notification-service — its only client-facing surface is the /ws/notifications
# WebSocket endpoint, and this WebMVC-native gateway (spring-cloud-gateway-server-webmvc) has no
# WebSocket-proxying support (verified: no such classes in the jar, unlike the older WebFlux gateway).
# The SPA connects to notification-service's WebSocket port directly instead of through the gateway.

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: false

management:
  endpoint:
    health:
      probes:
        enabled: true
