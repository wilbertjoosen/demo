server:
  port: 8080

spring:
  application:
    name: gateway-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  cloud:
    # No static route table. Routes are built at runtime from the Eureka registry by
    # com.example.gateway.routing.DiscoveryRouteRefresher: each backend service publishes the public
    # path prefix(es) it owns as `eureka.instance.metadata-map."gateway.paths"`, and the gateway turns
    # those into lb://<service-id> proxy routes — plus a /docs/<service-id>/v3/api-docs route per
    # service (rewritten onto that service's own /v3/api-docs) so this gateway's single Swagger UI can
    # aggregate them. Adding, removing or re-pathing a service needs no change here. The table is
    # rebuilt on each Eureka registry refresh; `POST /actuator/refresh` forces it immediately.
    # Services that publish no gateway.paths metadata (infra, WebSocket-only notification-service) are
    # deliberately not routed.
    #
    # Failover: if a route resolves to a service with 2+ instances registered in Eureka and one is
    # down/erroring, the LoadBalancer retries against a *different* instance automatically (enabled
    # by default; retry-on-all-operations is off by default since retrying a POST/PUT across
    # instances is only safe for idempotent calls — set true here for demo completeness across all
    # our routes, but a real system should judge this per-route rather than globally).
    loadbalancer:
      retry:
        enabled: true
        retry-on-all-operations: true
        max-retries-on-next-service-instance: 1

# Note: no route for notification-service's /ws/notifications, or chat-service's /ws/chat/** — this
# WebMVC-native gateway (spring-cloud-gateway-server-webmvc) has no WebSocket-proxying support
# (verified: no such classes in the jar, unlike the older WebFlux gateway). The SPA connects to both
# services' WebSocket ports directly instead of through the gateway; only chat-service's REST history
# endpoint (/api/chat/messages) is routed, via its gateway.paths metadata.

# springdoc.swagger-ui.urls (the per-service dropdown for this gateway's aggregated Swagger UI) is not
# listed here — DiscoveryRouteRefresher populates SwaggerUiConfigProperties.setUrls() on every rebuild
# with one entry per documented service currently registered in Eureka.

cors:
  # localhost:5173 is the Vite dev server; demo.localhost:18090 is the k3d ingress the built SPA is
  # served from — the SPA's own API calls always target localhost:8080 (see frontend/.env.production)
  # regardless of which origin served the page itself, so both need to be allowed here.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://demo.localhost:18090}

# Per-client-IP token bucket (see RateLimitFilter) — sustained 20 req/s with a burst of 20 comfortably
# covers a normal page load (several concurrent panel/table fetches) while still meaningfully
# throttling a single client hammering the gateway.
rate-limit:
  capacity: ${RATE_LIMIT_CAPACITY:20}
  refill-tokens: ${RATE_LIMIT_REFILL_TOKENS:20}
  refill-period-seconds: ${RATE_LIMIT_REFILL_PERIOD_SECONDS:1}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: false

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        # refresh: POST /actuator/refresh forces DiscoveryRouteRefresher to rebuild the route table
        # immediately instead of waiting for the next Eureka registry refresh. health/info/prometheus
        # match what the backend services expose.
        include: health,info,prometheus,refresh
      # Actuator endpoints are wired by Boot's own autoconfiguration, separate from CorsConfig's
      # WebMvcConfigurer mapping — without this, the SPA's health-check ping to /actuator/health
      # gets a 200 with no CORS headers, which the browser then blocks reading.
      cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://demo.localhost:18090}
        allowed-methods: GET
