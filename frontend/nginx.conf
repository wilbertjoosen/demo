server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite content-hashes every filename under /assets/, so a stale cached copy can never mask a
    # newer one — a changed file always gets a new URL. Safe to cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html's URL never changes between deploys, unlike the hashed assets it references, so it
    # must always be revalidated. Without this, browsers fall back to heuristic caching (based on
    # Last-Modified) and can keep serving an old index.html — or, worse, a response captured mid
    # rolling-update when this same URL briefly served the SPA-fallback body for a since-renamed
    # asset chunk — long after a new version is live. try_files' internal fallback to /index.html
    # re-enters location matching, so this also covers every client-side route, not just "/".
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
