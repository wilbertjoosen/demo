server:
  port: 8092
spring:
  application:
    name: product-media-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}

  mongodb:
    uri: mongodb://${MONGO_HOST:localhost:27017}/${MONGO_DB:media}${MONGO_REPLICA_SET_PARAM:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: false
    metadata-map:
      # Public path prefix this service owns at the gateway edge — gateway-service builds its route
      # table from this metadata (see user-service's application.yaml for the full note).
      "gateway.paths": /api/media/**

keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak.localhost:8181/realms/demo}
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak.localhost:8181/realms/demo/protocol/openid-connect/certs}

management:
  endpoint:
    health:
      probes:
        enabled: true

aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME}
    # Presigned uploads land here first, never directly in the production bucket above —
    # MediaValidationListener is the only thing that moves an object from staging to production,
    # and only after inspecting its actual bytes (see MediaContentValidator).
    staging-bucket-name: ${AWS_S3_STAGING_BUCKET_NAME}

media:
  upload-dir: ${MEDIA_UPLOAD_DIR:media-uploads}
  presigned-upload:
    # Below this, a single presigned PUT; at or above it, real S3 multipart upload. 8MB keeps the
    # multipart path exercised by anything but small images without forcing every tiny file through
    # the extra create/complete round trips.
    multipart-threshold-bytes: ${MEDIA_MULTIPART_THRESHOLD_BYTES:8388608}
    # 5MB is S3's own minimum part size for every part but the last — going lower would make S3
    # reject the multipart upload outright.
    part-size-bytes: ${MEDIA_MULTIPART_PART_SIZE_BYTES:5242880}
  multipart-cleanup:
    # Hourly: frequent enough that an abandoned upload's staging storage doesn't linger long, cheap
    # enough (ListMultipartUploads is a single call) not to matter at this scale.
    cron: ${MEDIA_MULTIPART_CLEANUP_CRON:0 0 * * * *}
    max-age: ${MEDIA_MULTIPART_CLEANUP_MAX_AGE:24h}
